# cargo-nextest の設定（ADR-0076）。coverage の関門は `cargo llvm-cov nextest` で流す。
# 並列度はここに書かない: integrate の検証は dagq.toml の [run.env] の
# NEXTEST_TEST_THREADS で絞り（決定 2）、CI と人の手元は nextest の既定（CPU 数）で流す。
# 落ちた test は 1 回だけ流し直し、流し直して通った test は FLAKY（FLKY-FL）と出すが、
# 結果は失敗のままにして不安定な test を隠さない（ADR-t768-1 が ADR-0076 を amends）。
# integrate は log の FLKY-FL から、落ちた test が全て FLAKY なら worker を resume せずに
# 着地を 1 回やり直す（docs/design/supervisor-lifecycle/integrate.md）。CI・人の手元・
# worker の stress にも同じく効く。

[profile.default]
retries = 1
flaky-result = "fail"
# 最初の失敗で新しい test の開始を止めず、全部の test を流しきる（task 777）。
# flaky-result = "fail" の下では FLAKY の test も失敗と数えるので、既定の fail-fast
# だと FLAKY が 1 件出た時点で残りが Cancelling になり、同じ回の本当の失敗が
# 見えないまま「落ちた test が全て FLAKY」と判定されて着地がやり直され、やり直しで
# 初めて見つかる（resume が 1 往復遅れる）。本当の失敗が複数あっても、resume された
# worker は 1 回の log で全部を見られる。費用は失敗した検証が test 段を最後まで流す分
# （最大で test 段 1 回分、中央値は約 160 秒）で、通る検証の時間は変わらない。
fail-fast = false
# 60 秒を超えた test を SLOW と出すだけで、打ち切らない（決定 6）。test の上限は
# tests/common/mod.rs の within（TEST_LIMIT 600 秒・STEP_LIMIT 300 秒）が持つので、
# terminate-after は置かず、その上限より先に nextest が test を止めることはない。
slow-timeout = { period = "60s" }

# scripts/it-coverage-map.sh の夜間の job（.github/workflows/it-coverage-map.yml）が
# 統合テストを coverage つきで流す profile。default の設定を継ぎ、テストごとの時間を
# 表に入れるため JUnit を target/nextest/it-coverage/junit.xml に書く。
[profile.it-coverage.junit]
path = "junit.xml"

# CI（.github/workflows/ci.yml の macOS の cargo llvm-cov nextest と Linux の
# cargo nextest run）が NEXTEST_PROFILE=ci で使う profile。default の設定（retries・
# flaky-result・fail-fast・slow-timeout）をそのまま継ぎ、JUnit を
# target/nextest/ci/junit.xml（cargo llvm-cov nextest でも同じ）に書くことだけを足す。CI はそれを成果物
# nextest-junit-<job> として上げ、CI の見張り（ADR-t1920-1）が落ちた test の名前を
# 読む。default に足さないのは、integrate と人の手元で使わない XML を書かせないため。
[profile.ci.junit]
path = "junit.xml"
