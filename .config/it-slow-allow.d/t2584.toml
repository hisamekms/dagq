reason = "B 境界（supervisor の配線・プロセス）: container の run の landing recheck の command 自身の 125 が fake の podman と実の dagq relay verify を通って container_refused にならず check の失敗として resumed と判定されることを supervisor を通して確かめる。付け替えの判断は domain::run_container の unit test"
