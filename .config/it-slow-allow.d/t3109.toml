[[test]]
name = "supervisor_service::a_resumes_wait_for_its_held_provider_is_never_kept_and_is_recorded_once"
reason = "B 境界（supervisorの配線）: a whole --once supervisor through the service takes a run a conflict parked while Claude is held, and its real resume path's provider_waiting the queue does not take is neither kept nor written, then recorded once (ADR-t3102-3 decision 5, ADR-t3255-1 decision 1); it lands one run and parks another to get there. Which records are never kept is application::supervisor_service::tests::a_runs_event_that_starts_something_or_is_found_again_is_never_kept"
task = 3109

