# 8.0-13.2s under stress at a load average of 10-14 (task 3109), class B
[[test]]
name = "supervisor_service::a_once_supervisor_reads_a_run_again_only_once_the_queue_took_its_held_end"
reason = "B 境界（supervisorの配線）: a whole --once supervisor through the service, whose run's e2e end the queue stays busy for, waits for the queue to take the held end before it reads the run again, so the e2e runs once and the run lands (ADR-t3102-3 decision 5); it runs a real e2e and landing. What becomes of a record the queue was busy for is application::supervisor_service::tests::a_results_record_the_queue_was_busy_for_is_held_and_told_as_still_held"
task = 3109

