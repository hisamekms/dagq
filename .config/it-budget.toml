# dagq::it（tests/it の binary）の合計の本数と秒の予算。毎晩 main で
# .github/workflows/it-budget.yml が CI の runner（ubuntu-24.04）で dagq::it だけを
# cargo nextest で流し、JUnit から求めた本数と test ごとの秒の和をここと比べ、
# 超えれば job を落とす（scripts/check-it-budget.sh。書式は script の冒頭）。
# 予算は今の値を超えないための天井で、着地は止めない。超過が finding になる経路と
# 規則は docs/development/testing.md の「CI」、B の実数から求めた目標（配線の層の後に
# 下げる値）は docs/plans/it-reduction.md の「予算と目標」。
#
# 本数: goal 239 の分類の後の tree（6014db2a3）の tests/it の #[test] は 1,915 本で、
# そのうち #[cfg(any())] の 41 本と #[ignore] の 12 本は nextest が流さず JUnit に
# 出ないので、流れる本数 1,862 本を上限にする（CI の linux の job の JUnit は
# 14cce0dd の tree で 1,859 本＝grep の 1,912 本−53 本で、この数え方と合う）。
#
# 秒: dagq::it だけを流す夜の job の 5 回の秒（成果物 it-budget の it-budget.md の
# seconds の measured）の最大 6,727.661 秒に約 1 割の余裕を付けた（× 1.1 ≒ 7,400）。
#   run 41251090949（2026-10-31） 5,407.140 秒
#   run 41361808065（2026-11-01） 6,727.661 秒
#   run 41563335489（2026-11-03） 4,116.787 秒
#   run 41746449723（2026-11-04） 5,262.574 秒
#   run 41943497896（2026-11-05） 4,415.278 秒
count = 1862
secs = 7400
decided = "2026-11-05"
basis = "本数は分類の後の tree の流れる本数、秒は夜の job の 5 回の最大 6,727.661 秒に約 1 割"
