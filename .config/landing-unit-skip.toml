# The unit tests the landing verification's unit stage leaves out
# (scripts/landing-it.sh, ADR-t4979-1). CI's macOS and Linux jobs still run
# every one of them: CI is the final gate for their breakage.
#
# Format: one [[test]] table per test, each key a one-line string:
#   name     the test's full nextest name in the lib tests of binary dagq
#            (`cargo nextest list --lib`), e.g. `module::tests::a_case`
#   reason   why it is left out (its seconds in the landing verification)
#   task     the task that put it here
#   restore  the task or goal that makes it light again and takes it out
# A file that cannot be read (not this format, a key missing or empty, an
# unknown key, a name twice) stops the landing verification with exit 2.
# Without this file, or without any [[test]], every unit test runs.
#
# Only goal 291's tasks and a person's decision may add a test here. It is
# not the place for the slow tests of every day: those meet the time gate of
# the unit tests. A change here is checked by `sh scripts/landing-it.sh --self-test`.
