[package]
name = "dagq"
version = "0.4.0-dev"
edition = "2024"
rust-version = "1.99"
description = "A dependency-aware task queue that runs coding agents in isolated Git worktrees"
license = "MIT"
repository = "https://github.com/hisamekms/dagq"
homepage = "https://github.com/hisamekms/dagq"
readme = "README.md"
keywords = ["task-queue", "dag", "git-worktree", "claude", "codex"]
categories = ["command-line-utilities", "development-tools"]
# Only what builds the binary: migrations are embedded with include_str!,
# and build.rs embeds the build identifier.
# The integration tests are listed below instead of one binary per tests/*.rs
# file (ADR-0078).
autotests = false
include = ["/build.rs", "/src/**", "/migrations/**", "/plugins/claude-dagq/skills/dagq/reference/kpi.md", "/Cargo.toml", "/Cargo.lock", "/README.md", "/LICENSE"]

[dependencies]
anyhow = "1.0"
# The buffer the driver's parameters are written to, behind the feature `postgres`.
bytes = { version = "1", optional = true }
clap = { version = "4.5", features = ["derive"] }
getrandom = "0.4"
libc = "0.2"
# The Postgres store's driver, behind the feature `postgres` (ADR-t3986-1).
postgres = { version = "0.19", optional = true }
rusqlite = { version = "0.40", features = ["backup", "bundled", "functions", "hooks", "modern_sqlite"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
sha2 = "0.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "std"] }
uuid = { version = "1.20", features = ["v4"] }

# The boundary lints of clippy.toml are off for the package and turned on
# in src/lib.rs on the modules the rules hold for (ADR-t2391-1 decision 2).
[lints.clippy]
disallowed_methods = "allow"
disallowed_types = "allow"
disallowed_macros = "allow"

# The library's entry points that open a queue's DB in the calling
# process, for tests that use the library on a queue of their own: only the
# queue service's process and `init` open one (ADR-t3102-2 decision 1), so
# the binary is built without them, and the tests turn them on through the
# dev-dependency on this package below.
[features]
test-paths = []
# The Postgres store's adapter (src/infrastructure/postgres/client.rs): not in
# a default build, so a local SQLite queue compiles none of its driver.
postgres = ["dep:bytes", "dep:postgres"]

[dev-dependencies]
dagq = { path = ".", features = ["test-paths"] }
# Reads the sources as syntax for the boundary tests (src/context_boundaries.rs).
proc-macro2 = { version = "1.0", default-features = false }
syn = { version = "2.0", default-features = false, features = ["full", "parsing", "visit"] }
tempfile = "3.25"

# One test binary for the integration tests (tests/it), so tests/common is
# compiled and the binary linked once; e2e and plugin stay separate because
# they are run by name (ADR-0078).
[[test]]
name = "it"
path = "tests/it/main.rs"

[[test]]
name = "e2e"
path = "tests/e2e.rs"

[[test]]
name = "plugin"
path = "tests/plugin.rs"

# Keep line tables so panic backtraces still point at file:line, and drop the
# debug info of dependencies: test binaries get smaller and link faster.
# Measured and not adopted (task 554, macOS arm64, ld-prime 1053): split-debuginfo
# off / packed, -Wl,-no_deduplicate, and the bundled rust-lld. With 13 test
# binaries after tests/it, `cargo test --no-run` after touching src/lib.rs took
# about 9-11 s and no candidate was 15% faster in both rounds; the differences
# stayed within the load noise, and rust-lld was slower.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.dev.package.libsqlite3-sys]
opt-level = 3
