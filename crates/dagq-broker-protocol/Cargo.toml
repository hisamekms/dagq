[package]
name = "dagq-broker-protocol"
# The one version of every crate in the workspace, written out rather than
# inherited (scripts/check-plugin-version.sh compares them; ADR-t827-1).
version = "0.4.0-dev"
edition = "2024"
rust-version = "1.98"
description = "The wire protocol of the dagq resource broker: capabilities, token claims, errors, requests and responses"
license = "MIT"
repository = "https://github.com/hisamekms/dagq"
homepage = "https://github.com/hisamekms/dagq"
keywords = ["dagq", "broker", "protocol"]
categories = ["development-tools"]

# Only serde and what signing needs (ADR-t827-1 decision 2): dagq depends on
# this crate and must not take the HTTP stack with it. HMAC and base64url are
# small functions of its own over sha2.
[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3.25"
