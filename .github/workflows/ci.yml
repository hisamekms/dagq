name: CI

# A push run on main that fails opens or updates the ci-failure issue, and a
# later one that passes closes it (ci-failure.yml, which keys on this
# workflow's name; docs/design/ci-failure-issues.md).
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Supersede a pull request's older run, but keep every run on main.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: fmt / test / clippy / coverage
    # Apple Silicon, the platform the runtime is developed and run on.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history with its tags: check-migration-numbers.sh compares
          # the migrations with the latest release tag (ADR-t614-2).
          fetch-depth: 0

      - name: Install Rust
        # rust-toolchain.toml pins the channel, components and target; rustup
        # installs exactly that toolchain here (the same one local builds use).
        run: |
          set -euo pipefail
          rustup toolchain install --no-self-update
          rustup show active-toolchain
          cargo --version

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Install cargo-nextest
        uses: taiki-e/install-action@cargo-nextest

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: ADR numbers
        run: sh scripts/check-adr-numbers.sh

      - name: Migration numbers and released migrations
        run: sh scripts/check-migration-numbers.sh

      - name: Plugin version
        run: sh scripts/check-plugin-version.sh

      - name: Test file lines
        run: sh scripts/check-test-file-lines.sh

      - name: E2E quarantine marks
        run: sh scripts/check-e2e-quarantine.sh

      - name: AGENTS.md size
        run: sh scripts/check-agents-md-size.sh

      - name: Layer dependencies
        run: |
          sh scripts/check-layer-deps.sh
          sh scripts/check-layer-deps.sh --self-test

      - name: cargo clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      # cargo llvm-cov nextest runs the same test binaries as cargo test (unit
      # tests in src/lib.rs, the integration tests in the one binary tests/it
      # (ADR-0078), tests/e2e.rs and tests/plugin.rs, and the tests of the
      # broker's crates under crates/; no doctests), each
      # test in its own process and in parallel across binaries, and fails if
      # any test fails, so there is no separate cargo test step. It is the
      # same command integrate runs (ADR-0076); here nextest runs as many
      # tests at once as the runner has CPUs.
      # --workspace puts the broker's crates under crates/ in the report:
      # without it cargo-llvm-cov reports only the root package, whatever
      # default-members says (ADR-t828-1).
      # The e2e tests in tests/e2e.rs need a running cmux, so they stay
      # #[ignore]d here and are run by the worker before integrate.
      # The output is also kept for the slow-tests step below. shell: bash
      # runs with -o pipefail, so the step fails exactly when cargo llvm-cov
      # nextest fails (tee does not hide its exit status).
      - name: cargo llvm-cov nextest
        shell: bash
        run: cargo llvm-cov nextest --locked --workspace --fail-under-lines 80 2>&1 | tee "$RUNNER_TEMP/nextest.log"

      # The slowest tests and the counts over 1, 5 and 30 seconds, in the job
      # summary (scripts/slow-tests.sh, docs/design/slow-tests.md). It runs
      # after a failed test step too, and its own failure never fails CI.
      - name: Slow tests
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          if [ -s "$RUNNER_TEMP/nextest.log" ]; then
            sh scripts/slow-tests.sh "$RUNNER_TEMP/nextest.log" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "no nextest output to summarise"
          fi

      # The time gate of the tests in tests/it (ADR-t1707-1): a test the diff
      # from the base added or changed that took longer than the threshold
      # fails the job unless .config/it-slow-allow.toml names it
      # (scripts/check-it-test-time.sh, docs/design/slow-tests.md). The base
      # is the commit before the push or the pull request's base; a push
      # without one (the first push of a new branch) skips the gate. It reads
      # the same nextest output and runs after a failed test step too.
      - name: IT test time gate
        if: ${{ !cancelled() }}
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ ! -s "$RUNNER_TEMP/nextest.log" ]; then
            echo "skipped: no nextest output to read"
          elif [ -z "$BASE" ] || ! printf '%s' "$BASE" | grep -q '[^0]'; then
            echo "skipped: no base commit (the first push of a new branch: before is $BASE)"
          elif ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "skipped: the base commit $BASE is not in the history (a force push)"
          else
            sh scripts/check-it-test-time.sh --base "$BASE" "$RUNNER_TEMP/nextest.log"
          fi

  # Linux (ubuntu): cargo build and the whole test suite (goal 83,
  # docs/design/linux-ci.md). A Linux failure fails the workflow like a macOS
  # one; the tests that only hold on macOS are split out with
  # #[cfg(target_os = "macos")] and listed in that document, and the names of
  # the failed tests go to the job summary. Coverage, fmt, clippy and the
  # scripts' checks stay in the macOS job above.
  linux:
    name: linux build / test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        # rust-toolchain.toml pins the channel and components; rustup installs
        # the host's (x86_64-unknown-linux-gnu) std besides the targets it
        # lists, so the file needs no Linux target.
        run: |
          set -euo pipefail
          rustup toolchain install --no-self-update
          rustup show active-toolchain
          cargo --version

      - name: Install cargo-nextest
        uses: taiki-e/install-action@cargo-nextest

      - uses: Swatinem/rust-cache@v2

      - name: cargo build
        run: cargo build --locked

      # The same test binaries as the macOS job's cargo llvm-cov nextest, with
      # the e2e tests left #[ignore]d. .config/nextest.toml has fail-fast off,
      # so one run lists every failed test. shell: bash runs with -o pipefail,
      # so the step fails exactly when nextest fails.
      - name: cargo nextest run
        shell: bash
        run: cargo nextest run --locked --color never 2>&1 | tee "$RUNNER_TEMP/nextest.log"

      # The failed tests, one "<binary id> <test name>" per row, in the job
      # summary. FLKY-FL is a test that failed and then passed on its retry.
      - name: Failed tests
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/nextest.log"
          {
            echo "## Linux: failed tests"
            echo
            if [ ! -s "$log" ] || ! grep -qE '^ +Summary \[' "$log"; then
              echo "no nextest summary (the build or the setup failed; see the log)"
            else
              # The rows after the last "Summary [" line whose status is in
              # the explicit set of docs/design/linux-ci.md (the same as
              # src/domain/verify_failure.rs and scripts/stress-recent-tests.sh
              # read), e.g.
              #   FLKY-FL 2/2 [   0.015s] (2/3) dagq::it module::name
              #    TRY 2 FL+LK [   0.015s] (3/3) dagq::it module::name
              #   ABORT SIG 64 [   0.015s] (3/3) dagq::it module::name
              failed=$(awk '/^ +Summary \[/ { n = NR } { line[NR] = $0 }
                END { for (i = n + 1; i <= NR; i++) print line[i] }' "$log" |
                grep -E '^ *(FAIL|FAIL \+ LEAK|XFAIL|LEAK-FAIL|TIMEOUT|ABORT|SIG(HUP|INT|QUIT|ILL|TRAP|ABRT|FPE|KILL|SEGV|PIPE|ALRM|TERM)|ABORT SIG [0-9]+|TRY [0-9]+ (FAIL|FL\+LK|XFAIL|LKFAIL|TMT|ABORT|HUP|INT|QUIT|ILL|TRAP|ABRT|FPE|KILL|SEGV|PIPE|ALRM|TERM|SIG [0-9]+)|FLKY-FL [0-9]+/[0-9]+|FLAKY [0-9]+/[0-9]+) \[' |
                awk '$NF !~ /[])]$/ { print $(NF - 1), $NF }' | sort -u || true)
              if [ -z "$failed" ]; then
                echo "none"
              else
                echo "$(printf '%s\n' "$failed" | wc -l | tr -d ' ') failed:"
                echo
                echo '```'
                printf '%s\n' "$failed"
                echo '```'
              fi
              echo
              grep -E '^ +Summary \[' "$log" | tail -n 1 || true
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_STEP_SUMMARY"
