name: CI

# A push run on main that fails opens or updates the ci-failure issue, and a
# later one that passes closes it (ci-failure.yml, which keys on this
# workflow's name; the rules in docs/development/testing.md, section "CI").
# The macOS job (checks) is the only place the tests split out with
# #[cfg(target_os = "macos")] run: a landing's verification set to the
# container runs on Linux, which builds none of them, and they are not run on
# the host instead, which would run a worker's code outside the container; a
# failure here is the CI watch's to turn into a fix task (ADR-t2182-1).
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Supersede a pull request's older run, but keep every run on main.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # Whether the change is docs only (ADR-t2034-1): every path of git diff --name-only from the
  # base to this run's commit is under docs/ or a *.md at the root. A pull
  # request's base is its base. A push's base is the head commit of the latest
  # completed push run of this workflow on main whose checks job ended success
  # or failure, which must be an ancestor of this run's commit (ADR-t2134-1):
  # GitHub cancels a pending run of the same concurrency group when a newer
  # one comes, so the commit before the push may never have had its Rust jobs
  # run, and comparing with it would let a code change pass as docs only.
  # Without a base (none, all zeros, not in the history, an API that cannot be
  # read, no such run, a push base that is not an ancestor), with an empty
  # diff, or when this job fails, the output is not true and every job runs.
  # The log names the base and where it came from. --no-renames lists a
  # renamed file's old path too, so a file moved out of src/ into docs/ is not
  # docs only.
  changes:
    name: docs-only diff
    runs-on: ubuntu-24.04
    # actions: read for the runs and jobs of this workflow that give a push's base.
    permissions:
      contents: read
      actions: read
    outputs:
      docs_only: ${{ steps.diff.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history, so that the base is in it (a shallow checkout
          # has no base and would always run everything).
          fetch-depth: 0

      # The checks job is found by its name, the same as in [ci_watch]
      # required_jobs of dagq.toml: a change to the name changes this step too.
      - name: Docs-only diff
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          docs_only=false
          base= source=
          if [ "$EVENT" = pull_request ]; then
            base=$PR_BASE source="the pull request's base"
          elif workflow=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .workflow_id) &&
            runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?branch=main&event=push&status=completed&per_page=100" \
              --jq '.workflow_runs[] | "\(.id) \(.head_sha)"'); then
            # Newest first; a job list that cannot be read stops the search with no base.
            while read -r id sha; do
              [ -n "$id" ] || continue
              conclusion=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs" \
                --jq '.jobs[] | select(.name == "fmt / test / clippy / coverage") | .conclusion') || break
              case $conclusion in
                success|failure) base=$sha source="run $id ($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$id), checks $conclusion"; break ;;
              esac
            done <<EOF
          $runs
          EOF
          fi
          if [ "$EVENT" != pull_request ] && [ -n "$base" ] && ! git merge-base --is-ancestor "$base" "$GITHUB_SHA" 2>/dev/null; then
            source="$source, not in the history as an ancestor of this run's commit" base=
          fi
          if [ -n "$base" ] && printf '%s' "$base" | grep -q '[^0]' && git cat-file -e "$base^{commit}" 2>/dev/null &&
            files=$(git -c core.quotePath=false diff --no-renames --name-only "$base" "$GITHUB_SHA") &&
            [ -n "$files" ] && ! printf '%s\n' "$files" | grep -qvE '^(docs/.*|[^/]*\.md)$'; then
            docs_only=true
          fi
          echo "docs only: $docs_only (base: ${base:-none}, from: ${source:-no run found or read})"
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"

  # The checks that need no Rust toolchain, the doc checks among them: they
  # run on every change, docs only or not (ADR-t2034-1). The same macOS
  # runner as the Rust job, where the scripts are known to work.
  docs:
    name: docs / scripts checks
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history with its tags: check-migration-numbers.sh compares
          # the migrations with the latest release tag (ADR-t614-2), and the
          # design docs' allow list is compared with the base.
          fetch-depth: 0

      - name: ADR numbers
        run: sh scripts/check-adr-numbers.sh

      # The ADR index is generated and not committed (ADR-t1967-1); this
      # checks that every ADR's frontmatter can be read into it.
      - name: ADR index
        run: sh scripts/adr-index.sh --stdout >/dev/null

      - name: Frontmatter date lines
        run: sh scripts/check-frontmatter-dates.sh

      - name: Docs frontmatter
        run: sh scripts/check-doc-frontmatter.sh

      - name: Docs relative links
        run: sh scripts/check-doc-links.sh

      - name: Migration numbers and released migrations
        run: sh scripts/check-migration-numbers.sh

      - name: Plugin version
        run: sh scripts/check-plugin-version.sh

      - name: Test file lines
        run: sh scripts/check-test-file-lines.sh

      - name: E2E quarantine marks
        run: sh scripts/check-e2e-quarantine.sh

      - name: AGENTS.md size
        run: sh scripts/check-agents-md-size.sh

      # The budgets of the documents under docs/design and the allow list of
      # the documents over them (scripts/check-design-docs.sh,
      # docs/development/documents.md, section "design"). The allow list is
      # compared with the base: the pull request's base or the commit before
      # the push; without one in the history (the first push of a new branch,
      # a force push) the script takes the merge base with origin/main.
      - name: Design docs budgets
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE" ] && printf '%s' "$BASE" | grep -q '[^0]' && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            sh scripts/check-design-docs.sh --base "$BASE"
          else
            sh scripts/check-design-docs.sh
          fi
          sh scripts/check-design-docs.sh --self-test

      # One sentence to a line in the lines the change adds to the documents
      # under docs/design (scripts/check-design-sentences.sh,
      # docs/development/documents.md, section "design"). The base is taken
      # as for the budgets above.
      - name: Design docs sentences
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE" ] && printf '%s' "$BASE" | grep -q '[^0]' && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            sh scripts/check-design-sentences.sh --base "$BASE"
          else
            sh scripts/check-design-sentences.sh
          fi
          sh scripts/check-design-sentences.sh --self-test

      # The forms of the test rules a line shows, in the lines the change adds
      # under src and tests (scripts/check-test-rules.sh,
      # docs/development/testing.md). The base is taken as for the budgets
      # above.
      - name: Test rules
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE" ] && printf '%s' "$BASE" | grep -q '[^0]' && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            sh scripts/check-test-rules.sh --base "$BASE"
          else
            sh scripts/check-test-rules.sh
          fi
          sh scripts/check-test-rules.sh --self-test

      # The landing verification's choice of IT on its fixtures only; the
      # choice on a real diff needs the runtime's variables and the table.
      - name: Landing IT choice
        run: sh scripts/landing-it.sh --self-test

      # The check scripts check the tree of the cwd, as the program review of
      # a run runs them (docs/development/task-registration.md).
      - name: Check scripts' root
        run: sh scripts/check-scripts-root.sh

  # fmt, clippy, the coverage gate's cargo llvm-cov nextest and the steps
  # reading its output. Skipped by the job's if when the change is docs only
  # (the changes job above); the if holds when that job failed too, which
  # needs' default success() would not. The name: is named by required_jobs
  # of [ci_watch] in dagq.toml, and ci-failure.yml reads a success run with a
  # skipped job as no result, which holds while the Rust jobs are the only
  # jobs with an if: change those with it.
  checks:
    name: fmt / test / clippy / coverage
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    # Apple Silicon, the platform the runtime is developed and run on.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history: the IT test time gate compares the tests with
          # the base.
          fetch-depth: 0

      - name: Install Rust
        # rust-toolchain.toml pins the channel, components and target; rustup
        # installs exactly that toolchain here (the same one local builds use).
        run: |
          set -euo pipefail
          rustup toolchain install --no-self-update
          rustup show active-toolchain
          cargo --version

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Install cargo-nextest
        uses: taiki-e/install-action@cargo-nextest

      - uses: Swatinem/rust-cache@v2

      # The tests' CARGO_TARGET_TMPDIR, where tests/common/template.rs keeps
      # the fixture templates (fixture-templates/). rust-cache's cleanTargetDir
      # deletes the files there before it saves but keeps the directories, so a
      # restored cache can hold empty templates that fail the tests (main's CI
      # was red from 9/29 for this). Remove it right after the restore, before
      # any test runs. The paths: plain cargo builds in target/, whose tmp is
      # target/tmp; cargo llvm-cov builds in its own target directory
      # target/llvm-cov-target (cargo-llvm-cov's default; a local cargo
      # llvm-cov nextest leaves target/llvm-cov-target/tmp), so the tests here
      # get target/llvm-cov-target/tmp as CARGO_TARGET_TMPDIR.
      - name: Remove the target's tmp restored from the cache
        run: rm -rf target/tmp target/llvm-cov-target/tmp

      # The macos-14 runner's disk can run out under cargo llvm-cov nextest
      # (the instrumented build, each test's copies of the runtime binary in
      # the temporary directories, the profraw files): tests then fail with
      # "No space left on device" or "database or disk is full". So before
      # the tests this step deletes what the image ships and dagq's build and
      # tests never use: the Xcode apps other than the selected one (cargo
      # links with the selected Xcode's toolchain, so that one stays), the
      # simulator runtimes (iOS, watchOS, tvOS, visionOS; no test starts a
      # simulator) and the Android SDK. Each deletion is best effort: one that
      # fails or finds nothing does not fail the job, nor does the step
      # failing or hanging past its time limit (simctl talks to the simulator
      # service, and each Xcode app takes minutes to delete). The free space
      # (df -h) and the sizes of TMPDIR and target/llvm-cov-target go to the
      # log before and after, and the disk report after the tests shows them
      # again.
      - name: Free disk space for the tests
        timeout-minutes: 20
        continue-on-error: true
        shell: bash
        run: |
          report() {
            echo "--- disk: $1"
            df -h
            tmp="${TMPDIR:-$(getconf DARWIN_USER_TEMP_DIR)}"
            du -sh "$tmp" "$RUNNER_TEMP" target/llvm-cov-target 2>/dev/null || true
          }
          report "before freeing space"
          start=$SECONDS
          # Without the selected Xcode's path no Xcode app is removed.
          selected="$(cd "$(xcode-select -p)/../.." && pwd -P)" || selected=""
          echo "selected Xcode: ${selected:-unknown} (kept)"
          for app in /Applications/Xcode*.app; do
            [ -n "$selected" ] && [ -e "$app" ] || continue
            if [ -L "$app" ] || [ "$(cd "$app" && pwd -P)" = "$selected" ]; then
              continue
            fi
            echo "removing $app"
            sudo rm -rf "$app" || true
          done
          echo "removing the simulator runtimes"
          xcrun simctl runtime delete all || true
          sudo rm -rf /Library/Developer/CoreSimulator/Profiles/Runtimes || true
          # Only the image's fixed SDK location, never a path an environment
          # variable gives (ANDROID_HOME and the like), and only when its
          # canonical path is that location (no symlink to elsewhere); the
          # runner user owns it, so no sudo.
          sdk=/Users/runner/Library/Android/sdk
          if [ -d "$sdk" ] && [ ! -L "$sdk" ] && [ "$(cd "$sdk" && pwd -P)" = "$sdk" ]; then
            echo "removing $sdk"
            rm -rf "$sdk" || true
          fi
          echo "freeing space took $((SECONDS - start))s"
          report "after freeing space"

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      # cargo llvm-cov nextest runs the same test binaries as cargo test (unit
      # tests in src/lib.rs, the integration tests in the one binary tests/it
      # (ADR-0078), tests/e2e.rs and tests/plugin.rs; no doctests), each
      # test in its own process and in parallel across binaries, and fails if
      # any test fails, so there is no separate cargo test step. Landing does
      # not run it: integrate replaces a task's coverage gate command with the
      # landing verification (scripts/landing-it.sh, the unit tests and
      # selected integration tests), so this step is the final gate that runs
      # every test and holds line coverage at 80% (ADR-t1925-1). Here nextest
      # runs as many tests at once as the runner has CPUs.
      # dagq is a single package with no [workspace], so --workspace names
      # dagq alone and measures what the command without it measures; it
      # stays the gate command of the CI and the tasks' verify (ADR-t2126-1).
      # The e2e tests in tests/e2e.rs use the host's launchd and real
      # processes, so they stay #[ignore]d here; the runtime runs them on the
      # host before a run lands when the run needs them, and before an
      # auto-update puts a new build in place.
      # The output is also kept for the slow-tests step below. shell: bash
      # runs with -e -o pipefail, so the pipe's status is cargo llvm-cov
      # nextest's (tee does not hide it).
      # NEXTEST_PROFILE=ci is the default profile plus a JUnit file
      # (.config/nextest.toml), uploaded by the next step.
      # A dagq process a test spawned and killed (or one that ended mid-write)
      # can leave a corrupt profraw ("file header is corrupt"), and one such
      # file makes llvm-profdata merge fail the whole gate after every test
      # passed. So when the gate command fails, the step recovers only if
      # nextest's Summary line shows every test that ran passed and the log
      # has "failed to merge profile data": it deletes each
      # target/llvm-cov-target/*.profraw that llvm-profdata show (rustup's
      # llvm-tools, which cargo-llvm-cov uses) cannot read, writes their names
      # and count to the log and the job summary, and lets cargo llvm-cov
      # report with the same --workspace and --fail-under-lines 80 decide the
      # step. A test failure, coverage under 80%, any other failure, or no
      # readable profraw left fails the step as before. The gate command
      # itself stays as it is (ADR-t2126-1).
      - name: cargo llvm-cov nextest
        shell: bash
        env:
          NEXTEST_PROFILE: ci
        run: |
          log="$RUNNER_TEMP/nextest.log"
          if cargo llvm-cov nextest --locked --workspace --fail-under-lines 80 2>&1 | tee "$log"; then
            exit 0
          fi
          esc=$'\033'
          plain="$(sed "s/${esc}\[[0-9;]*m//g" "$log")"
          counts="$(printf '%s\n' "$plain" | sed -n 's/.*Summary \[.*\] *\([0-9][0-9]*\) tests\{0,1\} run: \([0-9][0-9]*\) passed.*/\1 \2/p' | tail -n 1)"
          run_count="${counts% *}"
          passed_count="${counts#* }"
          if [ -z "$counts" ] || [ "$run_count" != "$passed_count" ] \
            || ! grep -q 'failed to merge profile data' <<<"$plain"; then
            echo "not a profile merge failure after passing tests; no recovery"
            exit 1
          fi
          profdata=""
          for f in "$(rustc --print sysroot)"/lib/rustlib/*/bin/llvm-profdata; do
            [ -x "$f" ] && profdata="$f"
          done
          if [ -z "$profdata" ]; then
            echo "llvm-profdata not found in the toolchain's llvm-tools"
            exit 1
          fi
          removed=()
          readable=0
          for f in target/llvm-cov-target/*.profraw; do
            [ -e "$f" ] || continue
            if "$profdata" show "$f" >/dev/null 2>&1; then
              readable=$((readable + 1))
            else
              removed+=("$f")
              rm -f "$f"
            fi
          done
          if [ "${#removed[@]}" -eq 0 ]; then
            echo "no corrupt profraw to remove; no recovery"
            exit 1
          fi
          {
            echo "### Corrupt profraw files removed before the coverage report"
            echo
            echo "${#removed[@]} removed, $readable readable left:"
            for f in "${removed[@]}"; do
              echo "- \`$(basename "$f")\`"
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$readable" -eq 0 ]; then
            echo "no readable profraw left"
            exit 1
          fi
          cargo llvm-cov report --locked --workspace --fail-under-lines 80

      # The disk after the tests, failed or not: the free space (df -h) and
      # the sizes of TMPDIR, RUNNER_TEMP, target/llvm-cov-target and its tmp
      # (the tests' CARGO_TARGET_TMPDIR) and profraw files, so that a run that
      # ran out of space shows which of them grew. Its own failure never fails
      # CI.
      - name: Disk after the tests
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          df -h
          tmp="${TMPDIR:-$(getconf DARWIN_USER_TEMP_DIR)}"
          du -sh "$tmp" "$RUNNER_TEMP" target/llvm-cov-target target/llvm-cov-target/tmp 2>/dev/null || true
          echo "profraw: $(find target/llvm-cov-target -maxdepth 1 -name '*.profraw' 2>/dev/null | wc -l | tr -d ' ') files, $(find target/llvm-cov-target -maxdepth 1 -name '*.profraw' -exec du -ck {} + 2>/dev/null | awk '/total$/ {t += $1} END {print t + 0}') KiB"
          echo "largest entries in $tmp:"
          du -sk "$tmp"/* 2>/dev/null | sort -rn | head -n 10 || true

      # The tests' results for the CI watch, which reads the failed tests'
      # names from the artifacts named nextest-junit-* (ADR-t1920-1,
      # docs/design/supervisor-lifecycle/ci-watch.md). It runs after a failed
      # test step too, and its own failure never fails CI. cargo llvm-cov
      # builds in target/llvm-cov-target, but nextest writes the file under
      # the workspace's target/nextest.
      - name: Upload the nextest JUnit
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: nextest-junit-macos
          path: target/nextest/ci/junit.xml
          if-no-files-found: warn
          retention-days: 30

      # The slowest tests and the counts over 1, 5 and 30 seconds, in the job
      # summary (scripts/slow-tests.sh; its header says how to read it). It runs
      # after a failed test step too, and its own failure never fails CI.
      - name: Slow tests
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          if [ -s "$RUNNER_TEMP/nextest.log" ]; then
            sh scripts/slow-tests.sh "$RUNNER_TEMP/nextest.log" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "no nextest output to summarise"
          fi

      # The boundary gate of the tests in tests/it (ADR-t3762-1,
      # ADR-t3802-1): against the diff from the base, a new test in tests/it
      # that no id of the registry (.config/it-boundaries.d/*.toml, and the
      # old place .config/it-boundary.d/*.toml for a while) has as its
      # representative, a second test of one id, or a module that grows
      # without new ids fails the job (scripts/check-it-added-tests.sh, whose
      # header has the format and the counts). The
      # base is taken as for the time gate below; without one the script
      # takes the merge base with origin/main. It reads no nextest output and
      # runs after a failed test step too.
      - name: IT boundary gate
        if: ${{ !cancelled() }}
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE" ] && printf '%s' "$BASE" | grep -q '[^0]' && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            sh scripts/check-it-added-tests.sh --base "$BASE"
          else
            sh scripts/check-it-added-tests.sh
          fi
          sh scripts/check-it-added-tests.sh --self-test

      # The time gate of the tests in tests/it (ADR-t1707-1): a test the diff
      # from the base added or changed that took longer than the threshold
      # fails the job unless the allow list (.config/it-slow-allow.toml and
      # .config/it-slow-allow.d/*.toml) names it (scripts/check-it-test-time.sh,
      # whose header has the format). The base
      # is the commit before the push or the pull request's base; a push
      # without one (the first push of a new branch) skips the gate. It reads
      # the same nextest output and runs after a failed test step too.
      - name: IT test time gate
        if: ${{ !cancelled() }}
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ ! -s "$RUNNER_TEMP/nextest.log" ]; then
            echo "skipped: no nextest output to read"
          elif [ -z "$BASE" ] || ! printf '%s' "$BASE" | grep -q '[^0]'; then
            echo "skipped: no base commit (the first push of a new branch: before is $BASE)"
          elif ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "skipped: the base commit $BASE is not in the history (a force push)"
          else
            sh scripts/check-it-test-time.sh --base "$BASE" "$RUNNER_TEMP/nextest.log"
          fi

      # The same directories again before rust-cache's post step saves the
      # cache: an if: always() step at the end of the job runs before the post
      # steps, and rust-cache has no input to leave out a directory inside
      # target/ (cache-targets keeps or drops the whole of it), so this keeps
      # the templates out of the saved cache.
      - name: Remove the target's tmp before the cache is saved
        if: always()
        run: rm -rf target/tmp target/llvm-cov-target/tmp

  # Linux (ubuntu): cargo build and the whole test suite. A Linux failure
  # fails the workflow like a macOS one; the tests that only hold on macOS are
  # split out with #[cfg(target_os = "macos")] and a comment on why
  # (docs/development/testing.md, section "macOSに固有のtest"), and the names
  # of the failed tests go to the job summary. Coverage, fmt and clippy stay in
  # the macOS job above, the scripts' checks in the docs job.
  # Skipped on a docs-only change with the same if as the checks job.
  linux:
    name: linux build / test
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        # rust-toolchain.toml pins the channel and components; rustup installs
        # the host's (x86_64-unknown-linux-gnu) std besides the targets it
        # lists, so the file needs no Linux target.
        run: |
          set -euo pipefail
          rustup toolchain install --no-self-update
          rustup show active-toolchain
          cargo --version

      - name: Install cargo-nextest
        uses: taiki-e/install-action@cargo-nextest

      - uses: Swatinem/rust-cache@v2

      # The tests' CARGO_TARGET_TMPDIR, where tests/common/template.rs keeps
      # the fixture templates (fixture-templates/). rust-cache's cleanTargetDir
      # deletes the files there before it saves but keeps the directories, so a
      # restored cache can hold empty templates that fail the tests (main's CI
      # was red from 9/29 for this). Remove it right after the restore, before
      # any test runs. The path: cargo nextest run builds in target/, so
      # CARGO_TARGET_TMPDIR is target/tmp.
      - name: Remove the target's tmp restored from the cache
        run: rm -rf target/tmp

      - name: cargo build
        run: cargo build --locked

      # The same test binaries as the macOS job's cargo llvm-cov nextest, with
      # the e2e tests left #[ignore]d. .config/nextest.toml has fail-fast off,
      # so one run lists every failed test. shell: bash runs with -o pipefail,
      # so the step fails exactly when nextest fails.
      # NEXTEST_PROFILE=ci adds the JUnit file the next step uploads, as in
      # the macOS job.
      - name: cargo nextest run
        shell: bash
        env:
          NEXTEST_PROFILE: ci
        run: cargo nextest run --locked --color never 2>&1 | tee "$RUNNER_TEMP/nextest.log"

      - name: Upload the nextest JUnit
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: nextest-junit-linux
          path: target/nextest/ci/junit.xml
          if-no-files-found: warn
          retention-days: 30

      # The failed tests, one "<binary id> <test name>" per row, in the job
      # summary. FLKY-FL is a test that failed and then passed on its retry.
      - name: Failed tests
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/nextest.log"
          {
            echo "## Linux: failed tests"
            echo
            if [ ! -s "$log" ] || ! grep -qE '^ +Summary \[' "$log"; then
              echo "no nextest summary (the build or the setup failed; see the log)"
            else
              # The rows after the last "Summary [" line whose status is in
              # the explicit set of the Rust profile's doc
              # (src/domain/toolchain/rust.rs; scripts/stress-recent-tests.sh
              # reads the same), e.g.
              #   FLKY-FL 2/2 [   0.015s] (2/3) dagq::it module::name
              #    TRY 2 FL+LK [   0.015s] (3/3) dagq::it module::name
              #   ABORT SIG 64 [   0.015s] (3/3) dagq::it module::name
              failed=$(awk '/^ +Summary \[/ { n = NR } { line[NR] = $0 }
                END { for (i = n + 1; i <= NR; i++) print line[i] }' "$log" |
                grep -E '^ *(FAIL|FAIL \+ LEAK|XFAIL|LEAK-FAIL|TIMEOUT|ABORT|SIG(HUP|INT|QUIT|ILL|TRAP|ABRT|FPE|KILL|SEGV|PIPE|ALRM|TERM)|ABORT SIG [0-9]+|TRY [0-9]+ (FAIL|FL\+LK|XFAIL|LKFAIL|TMT|ABORT|HUP|INT|QUIT|ILL|TRAP|ABRT|FPE|KILL|SEGV|PIPE|ALRM|TERM|SIG [0-9]+)|FLKY-FL [0-9]+/[0-9]+|FLAKY [0-9]+/[0-9]+) \[' |
                awk '$NF !~ /[])]$/ { print $(NF - 1), $NF }' | sort -u || true)
              if [ -z "$failed" ]; then
                echo "none"
              else
                echo "$(printf '%s\n' "$failed" | wc -l | tr -d ' ') failed:"
                echo
                echo '```'
                printf '%s\n' "$failed"
                echo '```'
              fi
              echo
              grep -E '^ +Summary \[' "$log" | tail -n 1 || true
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_STEP_SUMMARY"

      # The same directories again before rust-cache's post step saves the
      # cache: an if: always() step at the end of the job runs before the post
      # steps, and rust-cache has no input to leave out a directory inside
      # target/ (cache-targets keeps or drops the whole of it), so this keeps
      # the templates out of the saved cache.
      - name: Remove the target's tmp before the cache is saved
        if: always()
        run: rm -rf target/tmp
