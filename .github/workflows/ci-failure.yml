name: CI failure issue

# Opens (or comments on) the one open ci-failure issue when a push run of
# ci.yml on main concludes failure, and closes it with a comment when a later
# push run on main succeeds. The trigger is the conclusion of the whole CI
# workflow, so a job with continue-on-error does not open the issue by itself
# (the linux job has none since task 1238). A success run with a skipped job
# (the Rust jobs skipped on a docs-only change, ADR-t2034-1) changes nothing,
# like a cancelled one.
# How it works: docs/design/ci-failure-issues.md.
on:
  workflow_run:
    # The name: of ci.yml.
    workflows: [CI]
    types: [completed]
    branches: [main]

# One at a time, in the order the CI runs completed.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

# Nothing for the workflow; the one job below asks for what it writes.
permissions: {}

jobs:
  report:
    name: open, update or close the ci-failure issue
    # Push runs on main only: a pull_request run never opens or closes the
    # issue. A cancelled or skipped run changes nothing.
    if: >-
      github.event.workflow_run.event == 'push' &&
      (github.event.workflow_run.conclusion == 'failure' ||
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-24.04
    permissions:
      # gh run list / gh run view: the newer runs and the failed jobs and steps.
      actions: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_ID: ${{ github.event.workflow_run.id }}
      RUN_URL: ${{ github.event.workflow_run.html_url }}
      RUN_CREATED: ${{ github.event.workflow_run.created_at }}
      CONCLUSION: ${{ github.event.workflow_run.conclusion }}
      SHA: ${{ github.event.workflow_run.head_sha }}
      # Passed through env, never spliced into the script: it is free text.
      MESSAGE: ${{ github.event.workflow_run.head_commit.message }}
    steps:
      - name: Report
        shell: bash
        run: |
          set -euo pipefail
          subject=$(printf '%s\n' "$MESSAGE" | head -n 1)

          # Whether a CI run has a skipped job: in ci.yml only the Rust jobs
          # have an if, which skips them on a docs-only change (ADR-t2034-1).
          # A success run with one does not show that the Rust jobs pass, so
          # it neither closes the issue nor stands in as the newer run below.
          # A failed gh fails this job: in an if, set -e would not stop it,
          # and an empty count would read as a skipped job.
          skips_a_job() {
            local n
            n=$(gh run view "$1" --json jobs \
              --jq '[.jobs[] | select(.conclusion == "skipped")] | length') ||
              { echo "gh run view $1 failed" >&2; exit 1; }
            [ "$n" != 0 ]
          }

          # A newer push run on main that already concluded success or
          # failure decides the issue instead of this older one. Its own
          # report may have been cancelled while pending (the concurrency
          # group keeps one pending run), so this report acts on it.
          candidates=$(gh run list --workflow ci.yml --branch main --event push \
            --status completed --limit 100 \
            --json databaseId,conclusion,createdAt,headSha,displayTitle,url \
            --jq "[.[] | select(.createdAt > \"$RUN_CREATED\")
                       | select(.conclusion == \"success\" or .conclusion == \"failure\")]
                  | sort_by(.createdAt) | reverse | .[] | @json")
          newer=""
          while IFS= read -r run; do
            [ -n "$run" ] || continue
            if [ "$(jq -r .conclusion <<<"$run")" = "success" ] &&
              skips_a_job "$(jq -r .databaseId <<<"$run")"; then
              echo "passing over the newer CI run $(jq -r .databaseId <<<"$run"): success with a skipped job"
              continue
            fi
            newer=$run
            break
          done <<<"$candidates"
          if [ -n "$newer" ]; then
            RUN_ID=$(jq -r .databaseId <<<"$newer")
            RUN_URL=$(jq -r .url <<<"$newer")
            CONCLUSION=$(jq -r .conclusion <<<"$newer")
            SHA=$(jq -r .headSha <<<"$newer")
            subject=$(jq -r .displayTitle <<<"$newer")
            echo "acting on the newer completed CI run $RUN_ID ($CONCLUSION)"
          fi

          if [ "$CONCLUSION" = "success" ] && skips_a_job "$RUN_ID"; then
            echo "CI run $RUN_ID passed with a skipped job (a docs-only change): it changes nothing"
            exit 0
          fi

          number=$(gh issue list --label ci-failure --state open --limit 1 \
            --json number --jq '.[0].number // empty')

          if [ "$CONCLUSION" = "success" ]; then
            if [ -z "$number" ]; then
              echo "CI passed and no ci-failure issue is open"
              exit 0
            fi
            body=$(printf '%s\n' \
              "CI on main passed again." \
              "" \
              "- commit: $SHA $subject" \
              "- run: $RUN_URL")
            gh issue close "$number" --comment "$body"
            echo "closed #$number"
            exit 0
          fi

          # The failed jobs and, under each, its failed steps. A job with
          # continue-on-error that failed is listed too (its conclusion is
          # failure), though it did not fail the workflow on its own.
          failed=$(gh run view "$RUN_ID" --json jobs --jq '
            .jobs[] | select(.conclusion == "failure")
            | "- job `\(.name)`: " +
              ([.steps[] | select(.conclusion == "failure") | "`\(.name)`"]
               | if length == 0 then "(no failed step; see the run)" else join(", ") end)')
          if [ -z "$failed" ]; then
            failed="- (no failed job listed; see the run)"
          fi
          body=$(printf '%s\n' \
            "CI on main failed." \
            "" \
            "- commit: $SHA $subject" \
            "- run: $RUN_URL" \
            "" \
            "Failed jobs and steps:" \
            "" \
            "$failed")

          gh label create ci-failure --color b60205 \
            --description "A push run of CI (ci.yml) on main failed" 2>/dev/null || true
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
            echo "commented on #$number"
          else
            gh issue create --label ci-failure --title "CI on main is failing" --body "$body"
            echo "opened a ci-failure issue"
          fi
