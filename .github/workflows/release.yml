name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  # Trusted Publishing: the OIDC token that crates-io-auth-action exchanges
  # for a short-lived crates.io token. No long-lived registry secret is used.
  id-token: write

env:
  TARGET: aarch64-apple-darwin

jobs:
  release:
    name: Build and publish ${{ github.ref_name }}
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
        with:
          # The tags, for the comparison with the previous release below.
          fetch-depth: 0

      - name: Check that the tag matches the crate version
        id: version
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          crate_version="$(awk -F '"' '/^\[package\]/ { p = 1; next }
                                       /^\[/ { p = 0 }
                                       p && /^version = / { print $2; exit }' Cargo.toml)"
          if [ "$tag_version" != "$crate_version" ]; then
            echo "tag ${GITHUB_REF_NAME} declares version ${tag_version} but Cargo.toml has ${crate_version}" >&2
            exit 1
          fi
          echo "version=${crate_version}" >> "$GITHUB_OUTPUT"

      # Cargo.toml and plugin.json agree with the tag, and the tag's
      # marketplace entry is the git-subdir source of plugins/claude-dagq with
      # ref this tag and no version (ADR-t617-1), so the plugin users install
      # is this release's.
      - name: Check the plugin version
        run: sh scripts/check-plugin-version.sh --tag "$GITHUB_REF_NAME"

      # The migrations of the previous release are unchanged (ADR-t614-2).
      - name: Check the migrations
        run: sh scripts/check-migration-numbers.sh --release "$GITHUB_REF_NAME"

      - name: Install the Rust toolchain
        run: |
          set -euo pipefail
          # rust-toolchain.toml pins the channel and the target.
          rustup toolchain install --no-self-update
          rustup show active-toolchain
          rustup target list --installed | grep -qx "$TARGET"
          cargo --version

      - name: Build the release binary
        run: |
          set -euo pipefail
          cargo build --release --locked --target "$TARGET"
          "target/${TARGET}/release/dagq" --version

      - name: Pack the archive and the checksums
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          archive="dagq-v${VERSION}-${TARGET}.tar.gz"
          mkdir -p dist
          cp "target/${TARGET}/release/dagq" LICENSE README.md dist/
          tar -czf "dist/${archive}" -C dist dagq LICENSE README.md
          rm dist/dagq dist/LICENSE dist/README.md
          cd dist
          shasum -a 256 "$archive" > SHA256SUMS
          shasum -a 256 -c SHA256SUMS
          cat SHA256SUMS

      - name: Create the GitHub Release
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          assets=("dist/dagq-v${VERSION}-${TARGET}.tar.gz" dist/SHA256SUMS)
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            "${assets[@]}" \
            || gh release upload "$GITHUB_REF_NAME" --clobber "${assets[@]}"

      # crates.io is an additional channel (ADR-0030): publish only after the
      # GitHub Release has its assets, and skip the version crates.io already
      # has, so a rerun of this workflow succeeds like the Release step does.
      - name: Check whether crates.io already has this version
        id: crates
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          status="$(curl -sS -o /dev/null -w '%{http_code}' \
            -A "dagq-release (https://github.com/hisamekms/dagq)" \
            "https://crates.io/api/v1/crates/dagq/${VERSION}")"
          case "$status" in
            200) echo "dagq ${VERSION} is already on crates.io; skipping the publish"
                 echo "published=true" >> "$GITHUB_OUTPUT" ;;
            404) echo "published=false" >> "$GITHUB_OUTPUT" ;;
            *)   echo "crates.io answered HTTP ${status} for dagq ${VERSION}" >&2
                 exit 1 ;;
          esac

      - name: Authenticate to crates.io
        if: steps.crates.outputs.published != 'true'
        id: crates-auth
        # The one exception to "no third-party actions": the official action
        # of the crates.io team (ADR-0030).
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish to crates.io
        if: steps.crates.outputs.published != 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-auth.outputs.token }}
        run: cargo publish --locked

  # The two Linux images (ADR-t3990-3 decision 1): each is built on a runner of
  # its architecture and pushed by digest alone, so the only tag is the
  # release's version, which image-publish puts on the manifest of both. These
  # jobs start after the release job, whose steps and order they do not touch;
  # a failure of any of them fails this workflow's run, and
  # `gh run rerun <run-id> --failed` goes on from there. The actions here are
  # GitHub's own, not third-party ones.
  image-build:
    name: Build ${{ matrix.image.name }} for ${{ matrix.platform.arch }}
    needs: release
    runs-on: ${{ matrix.platform.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image:
          - name: dagq-control
            containerfile: containers/control.Containerfile
          - name: dagq-run-base
            containerfile: src/infrastructure/container_image/base.Containerfile
        platform:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image.name }}
      IMAGE_NAME: ${{ matrix.image.name }}
      CONTAINERFILE: ${{ matrix.image.containerfile }}
      ARCH: ${{ matrix.platform.arch }}
    steps:
      - uses: actions/checkout@v5

      - name: Log in to the registry
        env:
          GH_TOKEN: ${{ github.token }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Build and push by digest
        id: build
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          args=()
          context=.
          if [ "$IMAGE_NAME" = dagq-run-base ]; then
            # The same inputs as the runtime's build of a release's base: the
            # release's client from crates.io, which the release job has just
            # published, and nothing from the checkout in the context.
            claude_code="$(sed -n 's/^pub const CLAUDE_CODE_VERSION: &str = "\(.*\)";$/\1/p' src/domain/container_image.rs)"
            test -n "$claude_code"
            args=(--build-arg "CLAUDE_CODE_VERSION=${claude_code}"
                  --build-arg "DAGQ_CLIENT_VERSION=${version}"
                  --build-arg "DAGQ_CLIENT_BUILD=${version}")
            context="$(mktemp -d)"
          fi
          # Pushing by digest needs a builder of its own; the default one cannot.
          docker buildx create --driver docker-container --use
          docker buildx build \
            --platform "linux/${ARCH}" \
            --file "$CONTAINERFILE" \
            --provenance=false \
            --sbom=false \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.version=${version}" \
            --metadata-file "${RUNNER_TEMP}/metadata.json" \
            --output "type=image,name=${IMAGE},push-by-digest=true,name-canonical=true,push=true" \
            "${args[@]}" \
            "$context"
          digest="$(jq -r '."containerimage.digest"' "${RUNNER_TEMP}/metadata.json")"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          mkdir "${RUNNER_TEMP}/digest"
          printf '%s' "$digest" > "${RUNNER_TEMP}/digest/${ARCH}"

      # Also shows that the control image's binary starts with nothing around
      # it, and that each image has this release's dagq.
      - name: Check the version in the image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          actual="$(docker run --rm --entrypoint /usr/local/bin/dagq "${IMAGE}@${DIGEST}" --version)"
          if [ "$actual" != "dagq ${GITHUB_REF_NAME#v}" ]; then
            echo "${IMAGE}@${DIGEST} reports ${actual}" >&2
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: image-digest-${{ matrix.image.name }}-${{ matrix.platform.arch }}
          path: ${{ runner.temp }}/digest/${{ matrix.platform.arch }}
          if-no-files-found: error
          overwrite: true

  image-publish:
    name: Publish ${{ matrix.name }}
    needs: image-build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      # What the provenance attestation needs.
      id-token: write
      attestations: write
    strategy:
      matrix:
        name: [dagq-control, dagq-run-base]
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
      IMAGE_NAME: ${{ matrix.name }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: image-digest-${{ matrix.name }}-*
          merge-multiple: true
          path: ${{ runner.temp }}/digests

      - name: Log in to the registry
        env:
          GH_TOKEN: ${{ github.token }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      # A version's tag never moves: a rerun keeps the manifest it finds, so
      # the digest in the release's notes stays the one deployments pinned.
      - name: Put the version's tag on one manifest of both architectures
        id: manifest
        run: |
          set -euo pipefail
          ref="${IMAGE}:${GITHUB_REF_NAME#v}"
          if ! inspected="$(docker buildx imagetools inspect "$ref" 2>&1 >/dev/null)"; then
            # Only a tag that is not there is created: any other error of the
            # registry must not read as that, or a rerun would move the tag.
            case "$inspected" in
              *"not found"*) ;;
              *) echo "$inspected" >&2; exit 1 ;;
            esac
            docker buildx imagetools create --tag "$ref" \
              "${IMAGE}@$(cat "${RUNNER_TEMP}/digests/amd64")" \
              "${IMAGE}@$(cat "${RUNNER_TEMP}/digests/arm64")"
          fi
          platforms="$(docker buildx imagetools inspect --raw "$ref" \
            | jq -r '[.manifests[].platform | "\(.os)/\(.architecture)"] | sort | join(" ")')"
          if [ "$platforms" != "linux/amd64 linux/arm64" ]; then
            echo "${ref} has the platforms ${platforms}" >&2
            exit 1
          fi
          digest="$(docker buildx imagetools inspect "$ref" --format '{{.Manifest.Digest}}')"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          mkdir "${RUNNER_TEMP}/manifest"
          printf '%s' "$digest" > "${RUNNER_TEMP}/manifest/${IMAGE_NAME}"

      - name: Attest the build's provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true

      - uses: actions/upload-artifact@v4
        with:
          name: image-manifest-${{ matrix.name }}
          path: ${{ runner.temp }}/manifest/${{ matrix.name }}
          if-no-files-found: error
          overwrite: true

  image-record:
    name: Write the images' digests to the GitHub Release
    needs: image-publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: image-manifest-*
          merge-multiple: true
          path: ${{ runner.temp }}/manifests

      # Replaces its own section, so a rerun does not repeat it, and keeps the
      # generated notes above it.
      - name: Write the digests to the release notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          IMAGE_REGISTRY: ghcr.io/${{ github.repository_owner }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          marker='<!-- dagq-image-digests -->'
          notes="${RUNNER_TEMP}/notes.md"
          gh release view "$GITHUB_REF_NAME" --json body --jq .body | sed "/^${marker}\$/,\$d" > "$notes"
          {
            echo "$marker"
            echo '## Container images'
            echo
            echo 'Pin by digest. `gh attestation verify oci://<image>@<digest> --repo '"$GITHUB_REPOSITORY"'` checks the provenance.'
            echo
            for name in dagq-control dagq-run-base; do
              digest="$(cat "${RUNNER_TEMP}/manifests/${name}")"
              echo "- \`${IMAGE_REGISTRY}/${name}:${version}@${digest}\`"
            done
          } >> "$notes"
          gh release edit "$GITHUB_REF_NAME" --notes-file "$notes"
          gh release view "$GITHUB_REF_NAME" --json body --jq .body
