name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  # Trusted Publishing: the OIDC token that crates-io-auth-action exchanges
  # for a short-lived crates.io token. No long-lived registry secret is used.
  id-token: write

env:
  TARGET: aarch64-apple-darwin

jobs:
  release:
    name: Build and publish ${{ github.ref_name }}
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
        with:
          # The tags, for the comparison with the previous release below.
          fetch-depth: 0

      - name: Check that the tag matches the crate version
        id: version
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          crate_version="$(awk -F '"' '/^\[package\]/ { p = 1; next }
                                       /^\[/ { p = 0 }
                                       p && /^version = / { print $2; exit }' Cargo.toml)"
          if [ "$tag_version" != "$crate_version" ]; then
            echo "tag ${GITHUB_REF_NAME} declares version ${tag_version} but Cargo.toml has ${crate_version}" >&2
            exit 1
          fi
          echo "version=${crate_version}" >> "$GITHUB_OUTPUT"

      # Cargo.toml and plugin.json agree with the tag, and the tag's
      # marketplace entry is the git-subdir source of plugins/claude-dagq with
      # ref this tag and no version (ADR-t617-1), so the plugin users install
      # is this release's.
      - name: Check the plugin version
        run: sh scripts/check-plugin-version.sh --tag "$GITHUB_REF_NAME"

      # The migrations of the previous release are unchanged (ADR-t614-2).
      - name: Check the migrations
        run: sh scripts/check-migration-numbers.sh --release "$GITHUB_REF_NAME"

      - name: Install the Rust toolchain
        run: |
          set -euo pipefail
          # rust-toolchain.toml pins the channel and the target.
          rustup toolchain install --no-self-update
          rustup show active-toolchain
          rustup target list --installed | grep -qx "$TARGET"
          cargo --version

      # dagq and the broker's client, built together (ADR-t827-1 decision
      # 5); the server (dagq-broker) runs in a Linux container and is built
      # from crates.io into the broker's image, not here.
      - name: Build the release binaries
        run: |
          set -euo pipefail
          cargo build --release --locked --target "$TARGET" -p dagq -p dagq-broker-client
          "target/${TARGET}/release/dagq" --version
          "target/${TARGET}/release/dagq-broker-client" --version

      - name: Pack the archive and the checksums
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          for binary in dagq dagq-broker-client; do
            archive="${binary}-v${VERSION}-${TARGET}.tar.gz"
            cp "target/${TARGET}/release/${binary}" LICENSE README.md dist/
            tar -czf "dist/${archive}" -C dist "$binary" LICENSE README.md
            rm "dist/${binary}" dist/LICENSE dist/README.md
          done
          cd dist
          shasum -a 256 "dagq-v${VERSION}-${TARGET}.tar.gz" \
            "dagq-broker-client-v${VERSION}-${TARGET}.tar.gz" > SHA256SUMS
          shasum -a 256 -c SHA256SUMS
          cat SHA256SUMS

      - name: Create the GitHub Release
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          assets=("dist/dagq-v${VERSION}-${TARGET}.tar.gz"
                  "dist/dagq-broker-client-v${VERSION}-${TARGET}.tar.gz"
                  dist/SHA256SUMS)
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            "${assets[@]}" \
            || gh release upload "$GITHUB_REF_NAME" --clobber "${assets[@]}"

      # crates.io is an additional channel (ADR-0030): publish only after the
      # GitHub Release has its assets, and skip a crate whose version
      # crates.io already has, so a rerun of this workflow succeeds like the
      # Release step does. The workspace's crates go out as one version in
      # this order (ADR-t827-1 decision 8): the protocol first, since the
      # others depend on it, and the server last, as the material of the
      # broker's image.
      - name: Check which crates crates.io already has at this version
        id: crates
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          pending=
          for crate in dagq-broker-protocol dagq dagq-broker-client dagq-broker; do
            status="$(curl -sS -o /dev/null -w '%{http_code}' \
              -A "dagq-release (https://github.com/hisamekms/dagq)" \
              "https://crates.io/api/v1/crates/${crate}/${VERSION}")"
            case "$status" in
              200) echo "${crate} ${VERSION} is already on crates.io; skipping it" ;;
              404) pending="${pending} ${crate}" ;;
              *)   echo "crates.io answered HTTP ${status} for ${crate} ${VERSION}" >&2
                   exit 1 ;;
            esac
          done
          echo "pending=${pending# }" >> "$GITHUB_OUTPUT"
          if [ -z "$pending" ]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Authenticate to crates.io
        if: steps.crates.outputs.published != 'true'
        id: crates-auth
        # The one exception to "no third-party actions": the official action
        # of the crates.io team (ADR-0030).
        uses: rust-lang/crates-io-auth-action@v1

      # One crate at a time, in the order above; each must be on crates.io
      # before the next that depends on it is verified.
      - name: Publish to crates.io
        if: steps.crates.outputs.published != 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-auth.outputs.token }}
          PENDING: ${{ steps.crates.outputs.pending }}
        run: |
          set -euo pipefail
          for crate in $PENDING; do
            cargo publish --locked -p "$crate"
          done
