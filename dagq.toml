# dagq が run に渡す設定。runtime が読むのは main checkout の作業ファイルで、
# run の worktree で変えても着地して main checkout に反映されるまで効かない。
# 書式と渡し先は docs/design/supervisor-lifecycle/run-environment.md。

[run.env]
# 依存 crate の compile の結果を sccache で run 間に共有する（ADR-0049 の決定 6・7）。
# target は run ごとの worktree の target/ のまま。CARGO_TARGET_DIR を run ごとの値にすると
# sccache の鍵に入って当たらなくなり、共有すると test と coverage の関門が誤るので置かない。
# CARGO_INCREMENTAL も変えない（切っても run 間の hit は増えず、worker の繰り返しの build が遅くなる）。
# sccache は人が `mise use -g sccache` で入れ、~/.local/bin/sccache に mise の shim への link を置く。
# 見つからなければ up・claim・integrate が止まり、inbox に install tool が出る（決定 8・9）。
RUSTC_WRAPPER = "sccache"
# server と話せないときは rustc を直接実行し、cache が効かないだけで build を失敗させない。
SCCACHE_IGNORE_SERVER_IO_ERROR = "1"
# run ごとの cargo の並列度（CARGO_BUILD_JOBS・RUST_TEST_THREADS・NEXTEST_TEST_THREADS）は、
# 8 コア / 16GB の host と下の [supervisor] の parallel = 3 を前提に、worker 3 本と integrate 1 本が
# 同時に cargo を回しても load が上がりすぎないように決めた。並列数や host を変えたら合わせて見直す。
# 経緯と測定は docs/plans/operation-rules-history.md（CARGO_BUILD_JOBS）と docs/plans/nextest-test-threads.md（test の並列度）。
# CARGO_BUILD_JOBS は build の job 数。4 本の cargo の合計が 16 並列（コア数の 2 倍）程度に収まる値にする。
CARGO_BUILD_JOBS = "4"
# RUST_TEST_THREADS は 1 つの test binary の中の並列 thread 数。test は待ちが中心で CPU をあまり使わないので
# build と分けて決める（docs/plans/nextest-measurement.md）。上げると関門の test 段が縮み、load と capture の
# 時間切れが増える。上げ下げの目安は docs/plans/nextest-test-threads.md の 6 章と 8.3 節。
RUST_TEST_THREADS = "6"
# coverage の関門（cargo llvm-cov nextest）で同時に走らせる test の process 数（ADR-0076 の決定 2）。
# nextest は RUST_TEST_THREADS を読まず既定で CPU 数だけ走らせるので、RUST_TEST_THREADS と同じ値にする。
# .config/nextest.toml には書かない（理由はその冒頭のコメント）。
NEXTEST_TEST_THREADS = "6"

[recheck]
# 着地のたびに supervisor が着地待ちの run を着地後の main に載せた木で確かめる軽い検査（ADR-0068 の決定 2）。
# merge-tree は git の衝突しか見つけないので、main の変更と合わせると compile しなくなる意味の衝突
# （task 292 のようなもの）を着地の前に見つけて、run を resume へ回す。
# queue dir の recheck/worktree で、CARGO_TARGET_DIR を recheck/target にして 1 本ずつ直列に走る
# （target は 1 つで同時に使うのは 1 本だけ）。env は [run.env] が渡る。
# 書式と流れは docs/design/supervisor-lifecycle/landing-recheck.md と run-environment.md。
# [recheck] を知らない旧バイナリは dagq.toml を読めなくなるので、固定バイナリが task 462 を含んでから足した。
command = "cargo check --locked --all-targets"

[supervisor]
# runtime が同時に立てる planner の上限（draft・finding・revise の planner で共有。既定 1）。
# 人の答えを待つ planner が枠をふさいでも draft と revise が進むように、当面の緩和として 2 にする
# （枠を空ける根本の対応は別。経緯は docs/plans/operation-rules-history.md）。
# supervisor が各 pass で読み直すので、着地して main checkout に反映されれば up し直さずに効く。
# [supervisor] の key を知らない旧バイナリは dagq.toml を読めなくなるので、key は固定バイナリを対応したものへ
# 入れ替えてから足す（規則は docs/design/supervisor-lifecycle/run-environment.md の [supervisor] の項、
# runtime_planners と parallel を足した順序は docs/plans/operation-rules-history.md）。
runtime_planners = 2
# 同時に走らせる run の数（既定 4）。上の [run.env] の CARGO_BUILD_JOBS・RUST_TEST_THREADS・
# NEXTEST_TEST_THREADS は並列 3 を前提に決めたので、変えるときはそれらと合わせて見直す。
# up に --parallel を付けるとその値がここより優先して登録に焼き込まれ、この parallel を読まなくなる（優先は key ごと）ので付けない。
# 待ちの上限 max_waiting は既定の 4 のままなので書かない。
parallel = 3

[provider_fallback]
# worker は使えない provider から別の provider へ切り替えず、控えが解けるのを待って同じ provider で続ける。人の判断（2026-10-06）。
# 振る舞いは ADR-t1857-1 と docs/design/provider-lifecycle.md の「切り替えを止める設定」、書式は run-environment.md の [provider_fallback] の項。
# jobs は書かない（task 1858 が未着地で、job の切り替えを止めるかは人が決めていない）。
# supervisor が各 pass で読み直すので、着地して main checkout に反映されれば up し直さずに効く。
# [provider_fallback] を知らない旧バイナリは dagq.toml を読めなくなるので、固定バイナリが task 1857 を含んでから足した。
workers = false

[tasks]
# task が宣言する変更の種類（change）の値の集合（ADR-t980-1、task 983。書式は
# docs/design/supervisor-lifecycle/run-environment.md、各値の意味と選び方は docs/development/task-registration.md の「change」）。
# 書いてあるので add と edit は集合の外の --change を拒み、lint と submit は change の無い task を止める。
# [tasks] を知らない旧バイナリは dagq.toml を読めなくなるので、固定バイナリが task 982 を含んでから足した。
changes = ["feature", "fix", "refactor", "test", "measure", "docs", "config"]

# goal のラベル（tag）の語彙（ADR-t1639-1 決定 6、task 1643。task 1642 の
# docs/plans/goal-priority-inventory.md「1. ラベルの語彙の案」を採用）。
# 書式は docs/design/supervisor-lifecycle/run-environment.md、各ラベルの意味と付け方は
# docs/development/task-registration.md の「goal の優先度とラベル」。
# [goals] を知らない旧バイナリは dagq.toml を読めなくなるので、固定バイナリが
# task 1640（優先度）・1641（この欄とラベル）を含んでから足した。着地の verify でも確かめる。
[goals]
tags = ["headless", "codex", "cmux", "throughput", "enterprise", "planning", "observability", "architecture", "reliability", "review", "docs"]

[roles.goal_review]
# goal review の job を Codex（codex exec の読み取りだけの sandbox）で動かし、Claude の goal review と
# provider・model で並べて比べる（goal 73、ADR-t1063-1、task 1067。書式と振る舞いは
# docs/design/supervisor-lifecycle/actor-model.md の provider）。model と effort は書かず、
# Codex の既定の model と medium に任せる。Codex が使えないときは Claude に切り替えて起動する。
# Codex で動ける役割は actor-model.md の provider の項（domain::actor_model::CODEX_ROLES）が持つ。
# この repository で codex にしている役割は、この節とこの下に続く [roles.*] の節（足した task はそれぞれのコメント）で、
# [roles.*] の節を持たない役割は provider を書かず、今までどおり Claude で動く。
# [roles.<role>] の provider を知らない旧バイナリは dagq.toml を読めなくなるので、
# 固定バイナリが task 1065 を含んでから足した。
provider = "codex"

[roles.review]
# 通常の run の review job を Codex（codex exec の読み取りだけの job）で動かす（人の 2026-10-01 の決定
# 「inbox と worker は Claude、それ以外の actor は Codex」の review の分。goal 80、ADR-t1207-1、task 1208。
# 書式と振る舞いは docs/design/supervisor-lifecycle/review.md と actor-model.md の provider）。
# model と effort は書かず、Codex の既定の model と medium に任せる。Codex が使えないときは Claude に切り替えて起動する。
# review の codex を知らない旧バイナリ（CODEX_ROLES に review が無い）は設定の誤りとして拒むので、
# 固定バイナリが task 1207 を含んでから足した。
provider = "codex"

[roles.plan_review]
# plan review の job を Codex（codex exec の読み取りだけの job）で動かす（人の 2026-10-01 の決定
# 「inbox と worker は Claude、それ以外の actor は Codex」の plan review の分。goal 80、task 1218・1219。
# 書式と振る舞いは docs/design/supervisor-lifecycle/plan-review.md の「Codexで動かす」と actor-model.md の provider）。
# model と effort は書かず、Codex の既定の model と medium に任せる。Codex が使えないときは Claude に切り替えて起動する
# （--no-claude では切り替えず plan review by hand に渡す）。plan_review の codex を知らない旧バイナリ
# （CODEX_ROLES に plan_review が無い）は設定の誤りとして拒むので、固定バイナリが task 1218 を含んでから足した。
provider = "codex"

[roles.throughput_review]
# スループットの見直し（毎時・日次・週次）の job を Codex（codex exec の読み取りだけの job）で動かす（人の 2026-10-01 の決定
# 「inbox と worker は Claude、それ以外の actor は Codex」のスループットの見直しの分。goal 80、task 1220・1221。
# 書式と振る舞いは docs/design/supervisor-lifecycle/throughput-review.md の「Codexで動かす」と actor-model.md の provider）。
# model と effort は書かず、Codex の既定の model と medium に任せる。Codex が使えないときは Claude に切り替えて起動する
# （--no-claude では切り替えず、throughput_review_finished の error に理由を残す）。throughput_review の codex を知らない旧バイナリ
# （CODEX_ROLES に throughput_review が無い）は設定の誤りとして拒むので、固定バイナリが task 1220 を含んでから足した。
provider = "codex"

[roles.observer]
# observer の job を Codex で動かす（人の 2026-10-01 の決定
# 「inbox と worker は Claude、それ以外の actor は Codex」の observer の分。goal 80、task 1224）。
# 書式と振る舞いは docs/design/supervisor-lifecycle/observer.md の「Codexで動かす」と actor-model.md の provider。
# model と effort は書かず、Codex の既定の model と medium に任せる。
# 固定バイナリが task 1223（observer の Codex 対応）と task 1378（Git の外の job に
# --skip-git-repo-check を付ける）を両方含むことを verify の関門で確かめてから足す。
provider = "codex"

[roles.runtime_planner]
# runtime の planner（revise・draft・finding・計画の依頼）を非対話（worker と同じ turn ごとの呼び出し）で動かす
# （人の 2026-10-02 の決定「runtime の planner を非対話に切り替えて 1 週間測り、問題なければ非対話を続ける」。
# goal 87、ADR-t1394-2 の決定 1、task 1396・1402。書式と振る舞いは docs/design/supervisor-lifecycle/actor-model.md の
# 「runtimeのplannerの経路」と plan-planners.md の同じ節）。runtime の既定（書かなければ interactive）は変えず、この repository だけを切り替える。
# supervisor が planner を開くたびに読むので、着地して main checkout に反映された後に開く planner から効き、動いている planner の経路は変えない。
# 基準値・評価のコマンド・対話に戻す基準は docs/plans/headless-planner-evaluation.md（戻すときはこの節を消すか route = "interactive" にする）。
# route を知らない旧バイナリは設定の誤りとして拒むので、固定バイナリが task 1396・1397・1398 を含んでから足した。
# provider・model・effort は書かず、Claude の既定のまま（Codex の planner は別の goal）。
route = "headless"

[headless]
# 非対話の session wrapper を cmux の workspace でなく、supervisor から切り離した background の process として動かす
# （人の 2026-10-02 の提起、goal 89、ADR-t1404-1 の決定 7、task 1405・1408）。task 1440（ADR-t1433-3 の決定 1・2）から、
# worker の wrapper はこの欄を受け付けて無視し、値に関わらず background で動く（"workspace" なら警告を出す。戻す経路は無い）。
# runtime の planner はその workspace の経路を消す task 1441 まで、この欄に従う。書式と振る舞いは
# docs/design/supervisor-lifecycle/headless-worker.md の「workspaceなしのbackgroundのwrapper」と run-environment.md の [headless] の項。
# 出力は `dagq run log` / `planner log` で読む。評価（退行の確認）は docs/plans/headless-background-evaluation.md。
# 欄を消すのは、古い固定バイナリが欄の無い dagq.toml を読めることを確かめてからの別の task（ADR-t1433-3 の決定 2）。
# [headless] を知らない旧バイナリは dagq.toml を読めなくなるので、固定バイナリが task 1405・1406 を含んでから足した。
wrapper = "background"

[areas]
# stats と kpi が着地 commit の差分から run の変更の対象（area）を求める対応表（ADR-t980-1、task 983。
# 書式と求め方は docs/design/supervisor-lifecycle/kpi.md の「area」）。glob は --paths と同じ規則で重なってよく、
# どこにも当たらないファイルは other に数える。保存しないので、直せば過去の全 run がその基準で分類し直される。
# [areas] を知らない旧バイナリは dagq.toml を読めなくなるので、固定バイナリが task 981 を含んでから足した。
runtime = ["src/**", "build.rs", "Cargo.toml", "Cargo.lock", "rust-toolchain.toml"]
migrations = ["migrations/**"]
broker = ["crates/**"]
tests = ["tests/**"]
plugin = ["plugins/**", ".claude-plugin/**"]
ci = ["scripts/**", ".github/**", ".config/**"]
docs = ["docs/**", "*.md"]
config = ["dagq.toml", ".dagq/review-agents/**"]

# KPI の目標（ADR-0051 の決定 17・19。書式は docs/design/supervisor-lifecycle/kpi.md の「目標」）。
# ここには host に依らない repository の方針だけを書く。phase.* や max_load_avg のように host の性能で
# 決まる目標は host.toml に書く。[kpi] の min_samples・breach_periods・breach_weeks・
# max_improvement_proposals は既定のまま書かない。層はどれも all（change・area を省く）、stat は率・値の既定（value）。
# 目標は 2026-09-26 に人と planner が ask 112 で決めた（planner の推奨を人が adopt し、inbox 経由の補足で
# first_pass_rate と asks_per_landing を緩めた）。「実績」は決めたときの 2026-W39 途中、all、n≈240 の値。
# [kpi] を知らない旧バイナリは dagq.toml を読めなくなるので、固定バイナリが task 430 を含んでから足した。

# 1 つの run が resume・revise・着地の延期なしで着地した task の割合。実績 0.70。
# 人の決定で推奨より緩めた: 実績とほぼ同じ線では揺れだけで目標割れになり、
# 2026-09-26 の test 並列度の変更（task 566）でも数字が動くため。
[kpi.targets.first_pass_rate]
min = 0.65

# 着地した run のうち revise を受けたものの割合。実績 0.05。planner の推奨どおり。
[kpi.targets.revise_rate]
max = 0.1

# integrate を試みた run のうち rebase の衝突で延期されたものの割合。実績 0.062。planner の推奨どおり。
[kpi.targets.conflict_rate]
max = 0.1

# integrate の検証を実行した試行のうち検証の失敗で延期されたものの割合。実績 0.04。planner の推奨どおり。
[kpi.targets.verification_failed_rate]
max = 0.1

# 終わった run のうち failed / interrupted のものの割合。実績 0.088。planner の推奨どおり。
[kpi.targets.failed_rate]
max = 0.1

# 終わった run あたりの resume の回数。実績 0.22。planner の推奨どおり。
[kpi.targets.resumes_per_run]
max = 0.3

# 着地 1 件あたりに開いた ask の数。実績 0.47。
# 人の決定で推奨より緩めた: 実績とほぼ同じ線では揺れだけで目標割れになり、
# 2026-09-26 の test 並列度の変更（task 566）でも数字が動くため。
[kpi.targets.asks_per_landing]
max = 0.6

[e2e]
# 差分がこの glob に触れる run にだけ、review が pass した後、着地の前に runtime が host で全部の e2e を流す
# （ADR-t963-1 の決定 2・3、ADR-t1233-2。worker は e2e を流さず、validating は要否を validation_finished の e2e_requirement に記録するだけ。
# 要否の判定は docs/design/supervisor-lifecycle/validation.md の「runtimeが流すe2e」、流し方は review.md の「着地の前のe2e」）。
# 置くのは実 cmux・実プロセス・実 Git の境目だけ: cmux の adapter、process と session、launchd、lifecycle（up / down・引き継ぎ）、
# integrate、install、update（自動更新と e2e の関門）、actor（worker・planner・inbox・job の session）の起動と、e2e そのもの（tests/e2e.rs と tests/e2e/ の下）。
# supervise の判断の部分（src/application/supervise/ の handoff.rs と update.rs 以外）は含めない。runtime の commit の多くが
# 触るので含めると狭める効果がほぼ消え、判断は fake の cmux の in-process の test（tests/it/runtime_*）が確かめ、
# 実物との組み合わせは自動更新が固定バイナリを入れ替える前に全部の e2e を流す関門（ADR-t963-1 の決定 1）が確かめるため。
# task に --evidence e2e を付けたものは、差分に依らず流す。書式の都合で配列は 1 行に書く。
# [e2e] を知らない旧バイナリは dagq.toml を読めなくなるので、固定バイナリが task 965 を含んでから足した。
paths = ["src/infrastructure/adapters.rs", "src/infrastructure/process.rs", "src/infrastructure/sessions.rs", "src/infrastructure/launchd.rs", "src/application/lifecycle.rs", "src/application/supervise/handoff.rs", "src/application/integrate.rs", "src/application/install.rs", "src/infrastructure/binaries.rs", "src/application/update.rs", "src/application/supervise/update.rs", "src/infrastructure/e2e_gate.rs", "src/application/actor_executor.rs", "src/application/session.rs", "src/application/headless_session.rs", "src/infrastructure/claude.rs", "src/infrastructure/codex.rs", "tests/e2e.rs", "tests/e2e/**"]

# Review の検査項目と参照先は .dagq/review-agents/<agent>.md（ADR-t1453-1）。
# 固定バイナリが task 1455 を含むことを着手時に確認し、着地の verify でも検査する。

[review.subagents.design-consistency]
# 挙動の名前を変えうる差分にも探した名前の確認を当てる（ADR-t1688-1 決定2、task 1727）。
paths = ["src/**", "crates/**", "migrations/**", "docs/design/**", "docs/development/**", "plugins/**", "tests/**", "scripts/**", "AGENTS.md", "dagq.toml", ".dagq/**"]

[review.subagents.test-rules]
paths = ["tests/**", "src/**", "crates/**", "Cargo.toml", ".config/e2e-quarantine.toml", ".config/it-slow-allow.toml"]

[review.subagents.migration-rules]
paths = ["migrations/**", "build.rs", "src/infrastructure/schema.rs", "src/infrastructure/schema/**", "tests/**", "crates/**"]

[review.subagents.adr-rules]
paths = ["docs/**"]

[review.subagents.config-rules]
paths = ["dagq.toml", ".config/**"]

[review.subagents.receipt-evidence]
paths = ["**"]

[review.subagents.plugin-generic]
paths = ["plugins/**"]

[review.subagents.architecture-boundaries]
paths = ["src/**", "crates/**"]
