# dagq が run に渡す設定。runtime が読むのは main checkout の作業ファイルで、
# run の worktree で変えても着地して main checkout に反映されるまで効かない。
# 書式と渡し先は docs/design/supervisor-lifecycle/run-environment.md。

[run.env]
# 依存 crate の compile の結果を sccache で run 間に共有する（ADR-0049 の決定 6・7）。
# target は run ごとの worktree の target/ のまま。CARGO_TARGET_DIR を run ごとの値にすると
# sccache の鍵に入って当たらなくなり、共有すると test と coverage の関門が誤るので置かない。
# CARGO_INCREMENTAL も変えない（切っても run 間の hit は増えず、worker の繰り返しの build が遅くなる）。
# sccache は人が `mise use -g sccache` で入れ、~/.local/bin/sccache に mise の shim への link を置く。
# 見つからなければ up・claim・integrate が止まり、inbox に install tool が出る（決定 8・9）。
RUSTC_WRAPPER = "sccache"
# server と話せないときは rustc を直接実行し、cache が効かないだけで build を失敗させない。
SCCACHE_IGNORE_SERVER_IO_ERROR = "1"
# run ごとの cargo の並列度（CARGO_BUILD_JOBS・RUST_TEST_THREADS・NEXTEST_TEST_THREADS）は、
# 8 コア / 16GB の host と下の [supervisor] の parallel = 3 を前提に、worker 3 本と integrate 1 本が
# 同時に cargo を回しても load が上がりすぎないように決めた。並列数や host を変えたら合わせて見直す。
# 経緯と測定は docs/plans/operation-rules-history.md（CARGO_BUILD_JOBS）と docs/plans/nextest-test-threads.md（test の並列度）。
# CARGO_BUILD_JOBS は build の job 数。4 本の cargo の合計が 16 並列（コア数の 2 倍）程度に収まる値にする。
CARGO_BUILD_JOBS = "4"
# RUST_TEST_THREADS は 1 つの test binary の中の並列 thread 数。test は待ちが中心で CPU をあまり使わないので
# build と分けて決める（docs/plans/nextest-measurement.md）。上げると関門の test 段が縮み、load と capture の
# 時間切れが増える。上げ下げの目安は docs/plans/nextest-test-threads.md の 6 章と 8.3 節。
RUST_TEST_THREADS = "6"
# coverage の関門（cargo llvm-cov nextest）で同時に走らせる test の process 数（ADR-0076 の決定 2）。
# nextest は RUST_TEST_THREADS を読まず既定で CPU 数だけ走らせるので、RUST_TEST_THREADS と同じ値にする。
# .config/nextest.toml には書かない（理由はその冒頭のコメント）。
NEXTEST_TEST_THREADS = "6"

[recheck]
# 着地のたびに supervisor が着地待ちの run を着地後の main に載せた木で確かめる軽い検査（ADR-0068 の決定 2）。
# merge-tree は git の衝突しか見つけないので、main の変更と合わせると compile しなくなる意味の衝突
# （task 292 のようなもの）を着地の前に見つけて、run を resume へ回す。
# host の run の recheck は queue dir の recheck/worktree で、CARGO_TARGET_DIR を recheck/target にして 1 本ずつ直列に走る
# （target は 1 つで同時に使うのは 1 本だけ）。env は [run.env] が渡る。
# container の run の command は integrate の verification の container で流れ、流せないときは host で流さず
# 何も判定しない（ADR-t2424-1）。
# 書式と流れは docs/design/supervisor-lifecycle/integrate.md の「landing recheck」と run-environment.md。
# [recheck] を知らない旧バイナリは dagq.toml を読めなくなるので、固定バイナリが task 462 を含んでから足した。
# paths は command を流す差分の glob（ADR-t2032-1）。Rust に関わる差分の無い run は、merge した木の Rust の部分が
# 着地のときに検証済みの main と同じで compile が壊れる経路がほぼ無いので、cargo check を流さず merge-tree だけを見る。
# migrations/** は build.rs と include_str! が compile のときに読むので含める。
# Rust の compile が include_str! / include_bytes! / build.rs で読む Rust 以外のファイルも入れる: kpi.md は throughput_review.rs の
# include_str!、src/**/fixtures/** は test の include_str!。
command = "cargo check --locked --all-targets"
paths = ["**/*.rs", "Cargo.toml", "**/Cargo.toml", "Cargo.lock", "build.rs", "rust-toolchain.toml", "migrations/**", "plugins/claude-dagq/skills/dagq/reference/kpi.md", "src/**/fixtures/**"]

[supervisor]
# runtime が同時に立てる planner の上限（draft・finding・revise の planner で共有。既定 1）。
# 人の答えを待つ planner が枠をふさいでも draft と revise が進むように、当面の緩和として 2 にする
# （枠を空ける根本の対応は別。経緯は docs/plans/operation-rules-history.md）。
# supervisor が各 pass で読み直すので、着地して main checkout に反映されれば up し直さずに効く。
# [supervisor] の key を知らない旧バイナリは dagq.toml を読めなくなるので、key は固定バイナリを対応したものへ
# 入れ替えてから足す（規則は docs/design/supervisor-lifecycle/run-environment.md の [supervisor] の項、
# runtime_planners と parallel を足した順序は docs/plans/operation-rules-history.md）。
runtime_planners = 2
# 同時に走らせる run の数（既定 4）。上の [run.env] の CARGO_BUILD_JOBS・RUST_TEST_THREADS・
# NEXTEST_TEST_THREADS は並列 3 を前提に決めたので、変えるときはそれらと合わせて見直す。
# up に --parallel を付けるとその値がここより優先して登録に焼き込まれ、この parallel を読まなくなる（優先は key ごと）ので付けない。
# 待ちの上限 max_waiting は既定の 4 のままなので書かない。
parallel = 3
# 着地の順番を待つだけの run が空けた枠で claim してよい軽い change（ADR-t1591-1、goal 104。振る舞いは
# docs/design/supervisor-lifecycle/claim-hold.md の「着地待ちが空けた軽い枠」、値は下の [tasks] changes の中のもの）。
# 着地は直列なので slot が着地待ちで埋まり、作業中の worker が 0 で claim が止まった（2026-10-03 23:36 JST）。
# docs と config は直近 7 日の着地で作業が短く verify も無いので軽くする（docs n=32 作業中央 4 分 / p90 12・verify 0、
# config n=11 作業中央 3 分 / p90 6・verify 0）。measure は verify 0 でも作業 p90 140 分なので入れない。
# 軽い枠で claim されるのは --paths を宣言した task だけ（規則は docs/development/task-registration.md の「change」）。
# light_changes を知らない旧バイナリは dagq.toml を読めなくなるので、固定バイナリが task 1591 を含んでから足した。
light_changes = ["docs", "config"]
# slot を持てる Spike の数（goal 96、ADR-t1487-2。振る舞いは docs/design/supervisor-lifecycle/claim-hold.md の
# 「実行区分の上限とaging」）。parallel 3 の中で人と合意した初期案 total 3 / Spike 1 の値。Spike は build・測定・試作で
# host の load が重くなりやすく、実装の枠を埋めないよう 1 に絞る。枠は予約しないので、Spike が無ければ実装が 3 枠を使う。
# class_aging は既定のままなので書かない。
# max_spikes・max_investigations を知らない旧バイナリは dagq.toml を読めなくなるので、固定バイナリが task 1489・1493 を含んでから足した。
max_spikes = 1
# 調査中の計画（Spike が claim されてから、未完了の Spike か open の Spike 起点の再計画の依頼が残る goal）の同時の数
# （goal 96、ADR-t1487-1 決定 7。振る舞いは claim-hold.md の「調査中の計画の上限」）。ADR と design は値を持たないので
# この repository で決めた。Spike の枠は上の max_spikes の 1 なので、1 つの goal の再計画の依頼を planner が処理するあいだに
# 別の goal の Spike 1 本が Spike の枠を使えるよう 2 にし、多くの goal が Spike を出して調査が膨らむのを止める
# （runtime_planners 2 とも釣り合う）。
max_investigations = 2

[provider_fallback]
# worker は使えない provider から別の provider へ切り替えず、控えが解けるのを待って同じ provider で続ける。人の判断（2026-10-06）。
# 振る舞いは ADR-t1857-1 と docs/design/provider-lifecycle.md の「切り替えを止める設定」、書式は run-environment.md の [provider_fallback] の項。
# jobs は書かない（job の切り替えを止めるかは人が決めていないので、既定 true のまま）。
# supervisor が各 pass で読み直すので、着地して main checkout に反映されれば up し直さずに効く。
# [provider_fallback] を知らない旧バイナリは dagq.toml を読めなくなるので、固定バイナリが task 1857 を含んでから足した。
workers = false

[ci_watch]
# supervisor が main の CI（.github/workflows/ci.yml、name: CI）の結果を gh で定期的に確かめて event に記録し、赤になったら
# 修正の finding を出し、既に落ちているテストの一覧を持つ（ADR-t1920-1、task 1921、goal 157 の段 1）。
# 振る舞いは docs/design/supervisor-lifecycle/ci-watch.md、書式は run-environment.md の [ci_watch] の項。
# branch は書かず、着地先の branch（[repository] が無いので origin の HEAD から決まる main）を見る。interval_secs は design の推奨の既定 600 のまま書かない。
# junit_artifacts は ci.yml が nextest の JUnit を上げる成果物 nextest-junit-macos・nextest-junit-linux の glob で、
# ci.yml で名前を変えたらここも合わせる。
# gh が無いか login していなければ up の preflight が拒み、走っている supervisor は claim と着地を止めて inbox に知らせる（worker は host にツールを入れない）。
# supervisor が各 pass で読み直すので、着地して main checkout に反映されれば up し直さずに効く。
# [ci_watch] を知らない旧バイナリは dagq.toml を読めなくなるので、固定バイナリが task 1921 を含んでから足した。
# required_jobs は ci.yml の Rust の job の name: で、docs だけの差分で job の if により飛ぶ。これが success でない success の実行は
# 緑と読まない（ADR-t2034-1）。ci.yml で name: を変えたら同じ変更でここも直す（ずれは ci_jobs_missing の attention が知らせる）。
# required_jobs を知らない旧バイナリは dagq.toml を読めなくなるので、固定バイナリが task 2035 を含んでから足した。
workflow = "ci.yml"
junit_artifacts = ["nextest-junit-*"]
required_jobs = ["fmt / test / clippy / coverage", "linux build / test"]

[landing_verification]
# 着地の検証で、task の coverage の関門のコマンドを unit test 全件と影響範囲で絞った IT に置き換える（ADR-t1925-1、task 1927、goal 157 の段 3b）。
# 置き換えと env の受け渡しは runtime（domain::landing_verification の doc comment）、IT の選び方・表の cache・閾値などの値は scripts/landing-it.sh と
# scripts/landing-it.py の冒頭が持ち、値の根拠は docs/plans/landing-it-selection.md の「決めたこと」。登録済みの task の --verify は書き換えない。
# replaces は旧と今の関門（cargo llvm-cov nextest ... と cargo llvm-cov --locked --fail-under-lines 80）に当たる。
# command は unit test 全件（workspace の lib・bin）と絞った IT を 1 回の cargo nextest run で流し、既に落ちているテストを外す。
# fmt・clippy と task に固有の検査は task の --verify にあるものが登録のまま流れるので、ここに重ねない。
# 行カバレッジの関門は CI（ci.yml）だけが見る。外すときはこの節を消せば、次の着地から登録のコマンドに戻る。
# [landing_verification] を知らない旧バイナリは dagq.toml を読めなくなるので、固定バイナリが task 1926 を含んでから足した。
replaces = ["cargo llvm-cov nextest", "cargo llvm-cov --locked --fail-under-lines 80"]
command = "sh scripts/landing-it.sh"

[fresh_session]
# worker の差し戻し・needs_session の resume・triage の resume で、直前の turn の peak_context（token 数）がこの値を超えていたら、
# 同じ worktree・branch のまま引き継ぎの prompt を渡して新しい session で続ける（ADR-t2080-1、goal 174 の段 2-b）。
# 振る舞いは docs/design/provider-lifecycle.md の「大きなcontextからの新しいsession」、書式は run-environment.md の [fresh_session] の項。
# 2026-10-19 08:36 JST（task 2076）に ADR の試算の 150000 で入れたが、10/19 の revise・resume で切り替えた session は 27 件中 9 件（33%）が
# resume_timeout の 3600 秒で時間切れになった（切り替えない session は 32 件中 1 件、3%）。読み直しと検査のやり直しが原因で、切り替え後も
# 1 turn で peak が 13〜42 万 token に戻り、1 run で最大 3 回切り替わった。止めずに 400000 に上げ、極端な積み増し（観測の最大は 962k）の
# session だけを切り替える。切り替えた session への引き継ぎの改善と計測の抜けは別の request で扱う。
# [fresh_session] を知らない旧バイナリは dagq.toml を読めなくなるので、固定バイナリが task 2129・2167 を含んでから足した。
peak_context_above = 400000

[toolchains.rust]
# この repository は Rust の project なので、runtime に組み込みの Rust の profile の利用者として宣言する（ADR-t2268-1 決定 3）。
# 宣言したので、組み込みの Rust の profile が着地の検証と landing recheck の出力（失敗の分類・落ちた test の名前・flaky のやり直しの env）を読む。
# 宣言しなければどの profile も働かず、runtime は言語に依らない host の分類と [verify_marks] で宣言した印だけで出力を読み、言語に依らない既定で動く。
# 検証の出力は paths に依らず宣言した profile が読む。paths は path に結びつくもの（build の出力と cache の置き場・推奨の案）の範囲で、
# host の landing recheck は merge した木のファイルに paths が当たるときだけこの宣言の build の出力の置き場（CARGO_TARGET_DIR を queue の recheck/target に向ける）を使い、
# doctor と status は当たる範囲として出し、dagq init と setup-review は推奨の案に写す（自動更新の source build は宣言に依らない）。
# paths は、この repository の Rust の範囲（build.rs を含む Rust の source と、cargo と toolchain の宣言のファイル。** は 0 個の段にも当たる）にする。
# 書式は infrastructure::run_env::TOOLCHAINS_PREFIX の doc comment、当て方は docs/design/toolchain-profiles.md。
# [toolchains.<name>] を知らない旧バイナリは dagq.toml を読めなくなるので、固定バイナリがこの表を読めるようになってから宣言する。
profile = "rust"
paths = ["**/*.rs", "**/Cargo.toml", "Cargo.lock", "rust-toolchain.toml"]

[telemetry]
# session の step が持つコマンドの詳しさと、台帳と run の作業の内訳を作るときの分類（ADR-t1662-3 決定 16・18・19 を ADR-t2268-1 が改めたもの）。
# 書式と各 key の意味は domain::command_rules::TelemetrySettings の doc comment、分類の流れは docs/design/measurement-commands.md。
# command_detail は既定の shape（フラグの名前・既知のサブコマンドは平文、値とほかの語は digest）を明示する。分類の規則がフラグの値と
# 位置の語の有無を読むので、program にするとサブコマンドを読む規則（下の規則と Rust の profile の規則）が当たらなくなり、redacted は形を残さない。
# failed_tests は既定の false のまま書かない（落ちた test の名前と path を取らない。要るなら別の task で決める）。
# 分類は上の [toolchains.rust] の宣言で Rust の profile の既定の規則（cargo の test・full_test・llvm_cov・fmt・build）と runtime の共通の規則
# （wait・dagq・git）が効くので、ここには写さない。下の [[telemetry.commands]] は、この repository の test target の名前に依る規則だけで、
# profile の規則より先に当てる（上から試し、最初に当たった規則の class）。実際に効く規則と出どころは dagq doctor が出す。
# run の作業の内訳も台帳と同じこの重ね合わせで作る（dagq のソースかでは分けない）。
# [telemetry] を知らない旧バイナリは dagq.toml を読めなくなるので、固定バイナリが task 1674 を含んでから足した。
command_detail = "shape"

[[telemetry.commands]]
# tests/e2e.rs（--test e2e と --test=e2e）は e2e の test で、integrate の検査の数え（verification_repeats）にも入る。
# Rust の profile は pj の test target を知らず、無ければ test になる。sub を問わず cargo test・cargo nextest run のどちらにも当てる。
class = "e2e"
program = "cargo"
flag_values = { "--test" = ["e2e"] }
takes_value = ["--test"]

[[telemetry.commands]]
# tests/it は integration test のほぼ全体を 1 つの binary に集めているので、filter も他の target も無い cargo test --test it は
# test 一式の実行（full_test、group は test）とみなす。Rust の profile は --test のある cargo test を絞った test にするので、この規則で上書きする。
# filter（位置の語）か他の target・package の指定があれば当たらず、profile の test になる（cargo test --test plugin も test のまま）。
class = "full_test"
group = "test"
program = "cargo"
sub = ["test"]
flag_values = { "--test" = ["it"] }
takes_value = ["--test"]
none_of = ["--lib", "--bin", "--bins", "--doc", "--example", "--package", "-p", "-E"]
positional = "none"

[[telemetry.commands]]
# 上と同じ理由で、cargo nextest run --test it も filter と他の target が無ければ full_test にする。
class = "full_test"
group = "test"
program = "cargo"
sub = ["nextest", "run"]
flag_values = { "--test" = ["it"] }
takes_value = ["--test"]
none_of = ["--lib", "--bin", "--bins", "--doc", "--example", "--package", "-p", "-E"]
positional = "none"

[local_checks]
# worker の手元の検証（stress と it の test の時間の関門）を要るかを、run の差分が test に触れたかで runtime が決める（ADR-t2589-1 決定 6・8）。
# tests は test とみなす path の glob。tests/** は test の helper（tests/common）も含み、src/** と crates/** の Rust の file の中の
# unit test の行は [toolchains.rust] の profile が見分ける（test でない行だけの変更は数えない）。見分けられない file は省かない側に倒れる。
# 各 gate の paths はそれを要する test の path、kind は記録の種類の名前で、scripts/cargo-brief.sh（stress）と
# scripts/check-it-test-time.sh（it-test-time）が記録に付ける名前と同じにする。どちらかを変えたら同じ変更でもう一方も直す。
# 関門の対象と流し方は docs/development/local-checks.md の「stress」と「itのtestの時間の関門」。e2e（tests/e2e.rs・tests/e2e/）と
# plugin（tests/plugin.rs）は stress の対象外なので gate の paths に入れない。
# 書式は infrastructure::run_env::LOCAL_GATES_PREFIX の doc comment。
# worker が receipt の前に流す scripts/check-local-gates.sh は gate と tests の値の写しを持つので、ここの値を変えたら同じ変更で script の写しも直す
# （食い違いは script が先に名指して exit 1 で止める）。
# [local_checks] を知らない旧バイナリは dagq.toml を読めなくなるので、固定バイナリが task 2624 を含んでから足した。
tests = ["tests/**", "src/**", "crates/**"]

[local_checks.gates.stress]
paths = ["tests/it/**", "src/**", "crates/**"]
kind = "stress"

[local_checks.gates.it-test-time]
paths = ["tests/it/**"]
kind = "it-test-time"

[verify_marks.within]
# tests/common の within helper が待ちの時間切れで打つ行（'test <名前> timed out: <待ったもの> did not happen within <時間>'）を、
# 着地の検証の timeout（host の分類: integrate がコマンドを 1 回流し直し、worker を resume しない）として読み、{test} を落ちた test の名前にする
# （ADR-t2268-1 決定 2）。この行は runtime の共通の分類にも Rust の profile にも無い、この repository に固有の印なので、ここで宣言する。
# 宣言しなければ、Rust の profile を宣言していてもこの行の失敗は unknown になり、落ちた test の名前も消える。
# 書式は infrastructure::run_env::VERIFY_MARKS_PREFIX の doc comment、当てる順は docs/design/toolchain-profiles.md。
# tests/common の within の行の文言を変えたら同じ変更でここも直す。
# [verify_marks.<name>] を知らない旧バイナリは dagq.toml を読めなくなるので、固定バイナリが task 2359 を含んでから足した。
class = "timeout"
line = "test {test} timed out: *did not happen within*"

[tasks]
# task が宣言する変更の種類（change）の値の集合（ADR-t980-1、task 983。書式は
# docs/design/supervisor-lifecycle/run-environment.md、各値の意味と選び方は docs/development/task-registration.md の「change」）。
# 書いてあるので add と edit は集合の外の --change を拒み、lint と submit は change の無い task を止める。
# [tasks] を知らない旧バイナリは dagq.toml を読めなくなるので、固定バイナリが task 982 を含んでから足した。
changes = ["feature", "fix", "refactor", "test", "measure", "docs", "config"]

# task の title が始まる接頭辞の集合（ADR-t2596-1 決定 4）。title は main の squash commit の件名になり
# （docs/development/documents.md の「commit」）、制御側の git は hook を走らせないので、main の接頭辞はここで揃える。
# 書いてあるので lint はこの接頭辞で始まらない title を報告し、submit は拒む（add と edit は拒まない）。
# 一覧の正本は .config/committed.toml の allowed_types で、両者を同じ並びに揃える。
title_prefixes = ["feat", "fix", "docs", "test", "refactor", "perf", "chore"]

# goal のラベル（tag）の語彙（ADR-t1639-1 決定 6、task 1643。task 1642 の
# docs/plans/goal-priority-inventory.md「1. ラベルの語彙の案」を採用）。
# 書式は docs/design/supervisor-lifecycle/run-environment.md、各ラベルの意味と付け方は
# docs/development/task-registration.md の「goal の優先度とラベル」。
# [goals] を知らない旧バイナリは dagq.toml を読めなくなるので、固定バイナリが
# task 1640（優先度）・1641（この欄とラベル）を含んでから足した。着地の verify でも確かめる。
[goals]
tags = ["headless", "codex", "cmux", "throughput", "enterprise", "planning", "observability", "architecture", "reliability", "review", "docs"]

[roles.goal_review]
# goal review の job を Codex（codex exec の読み取りだけの sandbox）で動かし、Claude の goal review と
# provider・model で並べて比べる（goal 73、ADR-t1063-1、task 1067。書式と振る舞いは
# docs/design/supervisor-lifecycle/actor-model.md の provider）。model と effort は書かず、
# Codex の既定の model と medium に任せる。Codex が使えないときは Claude に切り替えて起動する。
# Codex で動ける役割は actor-model.md の provider の項（domain::actor_model::CODEX_ROLES）が持つ。
# この repository で codex にしている役割は、この節とこの下に続く [roles.*] の節（足した task はそれぞれのコメント）で、
# [roles.*] の節を持たない役割は provider を書かず、今までどおり Claude で動く。
# [roles.<role>] の provider を知らない旧バイナリは dagq.toml を読めなくなるので、
# 固定バイナリが task 1065 を含んでから足した。
provider = "codex"

[roles.review]
# 通常の run の review job を Codex（codex exec の読み取りだけの job）で動かす（人の 2026-10-01 の決定
# 「inbox と worker は Claude、それ以外の actor は Codex」の review の分。goal 80、ADR-t1207-1、task 1208。
# 書式と振る舞いは docs/design/supervisor-lifecycle/review.md と actor-model.md の provider）。
# model と effort は書かず、Codex の既定の model と medium に任せる。Codex が使えないときは Claude に切り替えて起動する。
# review の codex を知らない旧バイナリ（CODEX_ROLES に review が無い）は設定の誤りとして拒むので、
# 固定バイナリが task 1207 を含んでから足した。
provider = "codex"

[roles.plan_review]
# plan review の job を Codex（codex exec の読み取りだけの job）で動かす（人の 2026-10-01 の決定
# 「inbox と worker は Claude、それ以外の actor は Codex」の plan review の分。goal 80、task 1218・1219。
# 書式と振る舞いは docs/design/supervisor-lifecycle/plan-review.md の「Codexで動かす」と actor-model.md の provider）。
# model と effort は書かず、Codex の既定の model と medium に任せる。Codex が使えないときは Claude に切り替えて起動する
# （--no-claude では切り替えず plan review by hand に渡す）。plan_review の codex を知らない旧バイナリ
# （CODEX_ROLES に plan_review が無い）は設定の誤りとして拒むので、固定バイナリが task 1218 を含んでから足した。
provider = "codex"

[roles.throughput_review]
# スループットの見直し（毎時・日次・週次）の job を Codex（codex exec の読み取りだけの job）で動かす（人の 2026-10-01 の決定
# 「inbox と worker は Claude、それ以外の actor は Codex」のスループットの見直しの分。goal 80、task 1220・1221。
# 書式と振る舞いは docs/design/supervisor-lifecycle/throughput-review.md の「Codexで動かす」と actor-model.md の provider）。
# model と effort は書かず、Codex の既定の model と medium に任せる。Codex が使えないときは Claude に切り替えて起動する
# （--no-claude では切り替えず、throughput_review_finished の error に理由を残す）。throughput_review の codex を知らない旧バイナリ
# （CODEX_ROLES に throughput_review が無い）は設定の誤りとして拒むので、固定バイナリが task 1220 を含んでから足した。
provider = "codex"

[roles.observer]
# observer の job を Codex で動かす（人の 2026-10-01 の決定
# 「inbox と worker は Claude、それ以外の actor は Codex」の observer の分。goal 80、task 1224）。
# 書式と振る舞いは docs/design/supervisor-lifecycle/observer.md の「Codexで動かす」と actor-model.md の provider。
# model と effort は書かず、Codex の既定の model と medium に任せる。
# 固定バイナリが task 1223（observer の Codex 対応）と task 1378（Git の外の job に
# --skip-git-repo-check を付ける）を両方含むことを verify の関門で確かめてから足す。
provider = "codex"

[roles.recovery]
# 復旧 job（終わった run の triage と生きている run の復旧）を Codex（codex exec の読み取りだけの job）で動かす（人の 2026-10-01 の決定
# 「inbox と worker は Claude、それ以外の actor は Codex」の復旧 job の分。goal 80、task 1226）。
# 書式と振る舞いは docs/design/supervisor-lifecycle/triage.md の「Codexで動かす」と actor-model.md の provider。
# model と effort は書かず、Codex の既定の model と medium に任せる。
# 固定バイナリが task 1225（復旧 job の Codex 対応）と task 1378（Git の外の job に
# --skip-git-repo-check を付ける）を両方含むことを verify の関門で確かめてから足す。
provider = "codex"

[areas]
# stats と kpi が着地 commit の差分から run の変更の対象（area）を求める対応表（ADR-t980-1、task 983。
# 書式と求め方は domain::areas::AreaMap と application::areas::AreaReader の doc comment）。glob は --paths と同じ規則で重なってよく、
# どこにも当たらないファイルは other に数える。保存しないので、直せば過去の全 run がその基準で分類し直される。
# [areas] を知らない旧バイナリは dagq.toml を読めなくなるので、固定バイナリが task 981 を含んでから足した。
runtime = ["src/**", "build.rs", "Cargo.toml", "Cargo.lock", "rust-toolchain.toml"]
migrations = ["migrations/**"]
tests = ["tests/**"]
plugin = ["plugins/**", ".claude-plugin/**"]
ci = ["scripts/**", ".github/**", ".config/**"]
docs = ["docs/**", "*.md"]
config = ["dagq.toml", ".dagq/agents/**", ".dagq/agent-cases/**"]

# KPI の目標（ADR-0051 の決定 17・19。書式は infrastructure::kpi_config と domain::kpi::config::Target の doc comment）。
# ここには host に依らない repository の方針だけを書く。phase.* や max_load_avg のように host の性能で
# 決まる目標は host.toml に書く。[kpi] の min_samples・breach_periods・breach_weeks・
# max_improvement_proposals は既定のまま書かない。層はどれも all（change・area を省く）、stat は率・値の既定（value）。
# 目標は 2026-09-26 に人と planner が ask 112 で決めた（planner の推奨を人が adopt し、inbox 経由の補足で
# first_pass_rate と asks_per_landing を緩めた）。「実績」は決めたときの 2026-W39 途中、all、n≈240 の値。
# [kpi] を知らない旧バイナリは dagq.toml を読めなくなるので、固定バイナリが task 430 を含んでから足した。

# 1 つの run が resume・revise・着地の延期なしで着地した task の割合。実績 0.70。
# 人の決定で推奨より緩めた: 実績とほぼ同じ線では揺れだけで目標割れになり、
# 2026-09-26 の test 並列度の変更（task 566）でも数字が動くため。
[kpi.targets.first_pass_rate]
min = 0.65

# 着地した run のうち revise を受けたものの割合。実績 0.05。planner の推奨どおり。
[kpi.targets.revise_rate]
max = 0.1

# integrate を試みた run のうち rebase の衝突で延期されたものの割合。実績 0.062。planner の推奨どおり。
[kpi.targets.conflict_rate]
max = 0.1

# integrate の検証を実行した試行のうち検証の失敗で延期されたものの割合。実績 0.04。planner の推奨どおり。
[kpi.targets.verification_failed_rate]
max = 0.1

# 終わった run のうち failed / interrupted のものの割合。実績 0.088。planner の推奨どおり。
[kpi.targets.failed_rate]
max = 0.1

# 終わった run あたりの resume の回数。実績 0.22。planner の推奨どおり。
[kpi.targets.resumes_per_run]
max = 0.3

# 着地 1 件あたりに開いた ask の数。実績 0.47。
# 人の決定で推奨より緩めた: 実績とほぼ同じ線では揺れだけで目標割れになり、
# 2026-09-26 の test 並列度の変更（task 566）でも数字が動くため。
[kpi.targets.asks_per_landing]
max = 0.6

[e2e]
# 差分がこの glob に触れる run にだけ、review が pass した後、着地の前に runtime が host で全部の e2e を流す
# （ADR-t963-1 の決定 2・3、ADR-t1233-2。worker は e2e を流さず、validating は要否を validation_finished の e2e_requirement に記録するだけ。
# 要否の判定は docs/design/supervisor-lifecycle/validation.md の「runtimeが流すe2e」、流し方は integrate.md の「着地の前のe2e」）。
# 置くのは実プロセス・実 launchd・実 Git の境目だけ: 外の道具の adapter、process と session、launchd、lifecycle（up / down・引き継ぎ）、
# integrate、install、update（自動更新と e2e の関門）、actor（worker・planner・inbox・job の session）の起動と、e2e そのもの（tests/e2e.rs と tests/e2e/ の下）。
# supervise の判断の部分（src/application/supervise/ の handoff.rs・handoff_slots.rs と update.rs 以外）は含めない。runtime の commit の多くが
# 触るので含めると狭める効果がほぼ消え、判断は fake の in-process の test（tests/it/runtime_*）が確かめ、
# 実物との組み合わせは自動更新が固定バイナリを入れ替える前に全部の e2e を流す関門（ADR-t963-1 の決定 1）が確かめるため。
# task に --evidence e2e を付けたものは、差分に依らず流す。書式の都合で配列は 1 行に書く。
# [e2e] を知らない旧バイナリは dagq.toml を読めなくなるので、固定バイナリが task 965 を含んでから足した。
paths = ["src/infrastructure/adapters.rs", "src/infrastructure/process.rs", "src/application/worktree_processes.rs", "src/infrastructure/sessions.rs", "src/infrastructure/launchd.rs", "src/application/lifecycle.rs", "src/application/supervise/host_ops/handoff.rs", "src/application/supervise/execution/handoff_slots.rs", "src/application/integrate.rs", "src/application/install.rs", "src/infrastructure/binaries.rs", "src/application/update.rs", "src/application/supervise/host_ops/update.rs", "src/infrastructure/e2e_gate.rs", "src/application/actor_executor.rs", "src/application/session.rs", "src/application/headless_session.rs", "src/infrastructure/claude.rs", "src/infrastructure/codex.rs", "tests/e2e.rs", "tests/e2e/**"]

# Review の検査項目と参照先は .dagq/agents/<agent>/AGENT.md（ADR-t1453-1、置き場は ADR-t1728-1）。
# 固定バイナリが task 1455 を含むことを着手時に確認し、着地の verify でも検査する。
# 文書の照合は全体の review だけが持ち、このrepositoryの規則は .dagq/review/builtin-acceptance.md に置く（ADR-t2389-1）。
# built-in の agent とプログラム（ADR-t2259-1 決定12）: builtin:tests は test-rules が docs/development/testing.md の規則で見るので重ねず無効にする。
# builtin:security・builtin:secrets は既定の on と paths のまま表を書かない。汎用の判断は built-in に任せ、dagq の secret の規則は config-rules が見るため。
# builtin:acceptance も既定のまま書かない。文書の照合は builtin:acceptance が上の規則で持ち、別の agent の job を持たない（builtin:docs は同梱されず、書けば誤り）。
[review.subagents."builtin:tests"]
enabled = false

[review.subagents.test-rules]
paths = ["tests/**", "src/**", "Cargo.toml", ".config/e2e-quarantine.toml", ".config/it-slow-allow.toml", ".config/it-slow-allow.d/**"]

# migration か schema を変える差分にだけ当てる。test の書き方の規則（A-140）は、migration を足す差分で同じ差分の test と一緒に見る。
[review.subagents.migration-rules]
paths = ["migrations/**", "build.rs", "src/infrastructure/schema.rs", "src/infrastructure/schema/**"]

# 規則は ADR・ADR の ID・ADR の frontmatter なので ADR の差分にだけ当てる。ADR 以外の docs の frontmatter は CI の scripts/check-doc-frontmatter.sh が見る。
[review.subagents.adr-rules]
paths = ["docs/adr/**"]

[review.subagents.config-rules]
paths = ["dagq.toml", ".config/**"]

[review.subagents.receipt-evidence]
paths = ["**"]

[review.subagents.plugin-generic]
paths = ["plugins/**"]

# 変更箇所のセキュリティを全ての差分で見る。指摘の行き先は既存のreviseとconcernの規則（ADR-t1906-1）。
[review.subagents.security]
paths = ["**"]

# run の review の自動の手直しの上限の後に、acceptance_unmet をコードの指摘に数えるコードの path（方針は ADR-t2599-1、
# 書式・既定・意味は domain::review_reason::CodePaths の doc comment）。paths が全部ここの外の acceptance_unmet は着地を止めず
# follow_up の draft になる（docs・plugin・.dagq・scripts・.config は入れない）。値は [areas] の runtime・migrations・tests に合わせた。
# Cargo.toml・Cargo.lock・rust-toolchain.toml は依存と toolchain を変えて build されるコードを変えるので、src と同じくコードに数える。
# [review.code] を知らない旧バイナリは dagq.toml を読めなくなるので、固定バイナリが task 2600 を含んでから足した。
[review.code]
paths = ["src/**", "tests/**", "migrations/**", "build.rs", "Cargo.toml", "Cargo.lock", "rust-toolchain.toml"]

# プログラムのreview（docs/design/supervisor-lifecycle/review-programs.md、ADR-t1895-2）。差分がpathsに当たるrunのreviewで、
# agentのjobより前に設定の順に流し、1本でも非0なら後のprogramとagentを起動せずにworkerへ返す。
# 挙げるのはCIがmainで流す形式の検査で、scripts/check-scripts-root.shの一覧に入り（landing branchのscriptを一時の場所に写し、
# cwdをrunのworktreeにして流す約束を満たす）、cargo・nextestを実行せず、3回の測定の最大が10秒以下で今のmainでexit 0になるものだけ。
# build・testを流すもの（ADR-t1895-2決定1）、10秒を超えるもの、今のmainで落ちるもの（関係ないrunまで差し戻す）は挙げない。
# 引数はCIと同じにし（CIが--baseを渡すcheck-design-docsとcheck-design-sentencesはscriptの既定の基点を使う）、--self-testは挙げない。
# 秒は2026-10-12に他のrunと並んだhostで3回測った最大で、順はその小さいものから。

# .config/e2e-quarantine.tomlの書式・重複・上限と、印のtestがtests/e2e.rsかtests/e2e/にあること。最大約0.1秒。
[review.programs.check-e2e-quarantine]
script = "scripts/check-e2e-quarantine.sh"
paths = [".config/e2e-quarantine.toml", "tests/e2e.rs", "tests/e2e/**"]

# plugin.jsonとCargo.tomlのversionの一致と、marketplace.jsonの形。Cargo.tomlは読むだけでcargoを実行しない。最大約0.1秒。
[review.programs.check-plugin-version]
script = "scripts/check-plugin-version.sh"
paths = ["Cargo.toml", "plugins/claude-dagq/.claude-plugin/plugin.json", ".claude-plugin/marketplace.json"]

# AGENTS.mdのbyteの上限。最大約0.1秒。
[review.programs.check-agents-md-size]
script = "scripts/check-agents-md-size.sh"
paths = ["AGENTS.md"]

# ADR以外のdocs/の文書のfrontmatterの必須のkey・値・id。最大約0.2秒。
[review.programs.check-doc-frontmatter]
script = "scripts/check-doc-frontmatter.sh"
paths = ["docs/**"]

# run branchのcommit（HEADとmainのmerge base..HEAD）の件名の接頭辞を、.config/committed.tomlのallowed_typesで見る。
# commit-msgのhookを通らないcommit（--no-verify・hookの無いhostやclone）をLLMのreviewの前に返すための関門で、hostにcommittedが無くても流れる。
# CIは流さない（mainのsquash commitはhookに掛からず、taskのtitleで揃える）。差分に依らず当たるようpathsは全て。
# 秒は2026-10-17に他のrunと並んだhostで3回測った最大で約0.4秒。
[review.programs.check-commit-messages]
script = "scripts/check-commit-messages.sh"
paths = ["**"]

# docs/designの文書の差分が足した・変えた行の1文1行（docs/development/documents.mdのdesignの「形と予算」）。
# LLMのreviewが見ていた1文1行の差し戻しをagentを起動する前に安く返し、直すcommitが新しい違反を足す連鎖を止めるため。
# 既存の行は検査しないので既存の文書の違反では落ちない。基点は既定（HEADとmainのmerge base）。最大約0.4秒。
[review.programs.check-design-sentences]
script = "scripts/check-design-sentences.sh"
paths = ["docs/design/**"]

# tests/の.rsの行数の上限。最大約0.7秒。
[review.programs.check-test-file-lines]
script = "scripts/check-test-file-lines.sh"
paths = ["tests/**"]

# migrationの番号の連続と、v0.3.0より後の最新のtagのmigrationが変わっていないこと（引数なし。--release TAGはrelease.ymlだけ）。最大約1.2秒。
[review.programs.check-migration-numbers]
script = "scripts/check-migration-numbers.sh"
paths = ["migrations/**", "build.rs"]

# docs/の.mdのfrontmatterの日付の行の形。最大約2.7秒。
[review.programs.check-frontmatter-dates]
script = "scripts/check-frontmatter-dates.sh"
paths = ["docs/**"]

# docs/とrootの.mdの相対リンクの実在。最大約8.3秒。
[review.programs.check-doc-links]
script = "scripts/check-doc-links.sh"
paths = ["docs/**", "*.md"]

# docs/designの文書の大きさ・1行の長さ・本文のtask番号の予算と、許可の一覧をHEADとmainのmerge baseと比べる。
# CIがpull requestかpushのbaseを--baseで渡すところ、ここでは渡さず既定（HEADとmainのmerge base。runのworktreeにはmainがある）を使う。最大約8.6秒。
[review.programs.check-design-docs]
script = "scripts/check-design-docs.sh"
paths = ["docs/design/**", ".config/design-docs-allow.toml"]

# docs/adr/のADRのIDとファイル名と日付。最大約9.4秒。
[review.programs.check-adr-numbers]
script = "scripts/check-adr-numbers.sh"
paths = ["docs/adr/**"]
