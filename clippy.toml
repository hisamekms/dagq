# What the boundary rules of docs/design/architecture.md forbid the inner
# layers to call or name (ADR-t2391-1 decision 2): each item's reason names
# its rule. The lints are allowed for the package in Cargo.toml's [lints]
# and turned on in src/lib.rs only on the modules the rules hold for, in a
# build without test: all three on domain and application, and
# disallowed_methods on the composition root. Each lint has one list for the
# package, so a list holds only what every module it is on forbids; what
# only the domain forbids (anyhow, the rest of std::process, std::net) is
# checked by the Rust test of the module references
# (src/context_boundaries/modules.rs). A place the rule lets read the clock
# gets an #[expect(clippy::disallowed_methods, reason = "...")] on the item.

disallowed-methods = [
    # The clocks and random IDs: the shared Clock and IdGenerator ports.
    { path = "std::time::SystemTime::now", reason = "L2, L4, L7: read the wall clock through the Clock port" },
    { path = "std::time::Instant::now", reason = "L2, L5, L7: read the monotonic clock through Clock::monotonic or take the time as a value" },
    { path = "std::time::Instant::elapsed", reason = "L2, L5, L7: measure from Clock::monotonic, the clock the instant was read on" },
    { path = "std::time::SystemTime::elapsed", reason = "L2, L4, L7: measure from the Clock port's wall clock" },
    { path = "uuid::Uuid::new_v4", reason = "L2, L4: make IDs through the IdGenerator port" },
    { path = "getrandom::fill", reason = "L2, L4: make IDs through the IdGenerator port" },
    { path = "getrandom::u32", reason = "L2, L4: make IDs through the IdGenerator port" },
    { path = "getrandom::u64", reason = "L2, L4: make IDs through the IdGenerator port" },
    # Files: the ports the infrastructure implements.
    { path = "std::fs::canonicalize", reason = "L2, L4: reach files through a port" },
    { path = "std::fs::copy", reason = "L2, L4: reach files through a port" },
    { path = "std::fs::create_dir", reason = "L2, L4: reach files through a port" },
    { path = "std::fs::create_dir_all", reason = "L2, L4: reach files through a port" },
    { path = "std::fs::exists", reason = "L2, L4: reach files through a port" },
    { path = "std::fs::hard_link", reason = "L2, L4: reach files through a port" },
    { path = "std::fs::metadata", reason = "L2, L4: reach files through a port" },
    { path = "std::fs::read", reason = "L2, L4: reach files through a port" },
    { path = "std::fs::read_dir", reason = "L2, L4: reach files through a port" },
    { path = "std::fs::read_link", reason = "L2, L4: reach files through a port" },
    { path = "std::fs::read_to_string", reason = "L2, L4: reach files through a port" },
    { path = "std::fs::remove_dir", reason = "L2, L4: reach files through a port" },
    { path = "std::fs::remove_dir_all", reason = "L2, L4: reach files through a port" },
    { path = "std::fs::remove_file", reason = "L2, L4: reach files through a port" },
    { path = "std::fs::rename", reason = "L2, L4: reach files through a port" },
    { path = "std::fs::set_permissions", reason = "L2, L4: reach files through a port" },
    { path = "std::fs::symlink_metadata", reason = "L2, L4: reach files through a port" },
    { path = "std::fs::write", reason = "L2, L4: reach files through a port" },
    { path = "std::fs::File::open", reason = "L2, L4: reach files through a port" },
    { path = "std::fs::File::create", reason = "L2, L4: reach files through a port" },
    { path = "std::fs::File::create_new", reason = "L2, L4: reach files through a port" },
    { path = "std::fs::File::options", reason = "L2, L4: reach files through a port" },
    { path = "std::fs::OpenOptions::new", reason = "L2, L4: reach files through a port" },
    { path = "std::fs::DirBuilder::new", reason = "L2, L4: reach files through a port" },
    # Outside commands.
    { path = "std::process::Command::new", reason = "L2, L4: run commands through a port" },
    # The database.
    { path = "rusqlite::Connection::open", reason = "L2, L4: reach the database through a port" },
    { path = "rusqlite::Connection::open_with_flags", reason = "L2, L4: reach the database through a port" },
    { path = "rusqlite::Connection::open_in_memory", reason = "L2, L4: reach the database through a port" },
    { path = "rusqlite::Connection::execute", reason = "L2, L4: reach the database through a port" },
    { path = "rusqlite::Connection::execute_batch", reason = "L2, L4: reach the database through a port" },
    { path = "rusqlite::Connection::prepare", reason = "L2, L4: reach the database through a port" },
    { path = "rusqlite::Connection::prepare_cached", reason = "L2, L4: reach the database through a port" },
    { path = "rusqlite::Connection::query_row", reason = "L2, L4: reach the database through a port" },
    { path = "rusqlite::Connection::transaction", reason = "L2, L4: reach the database through a port" },
    { path = "rusqlite::Connection::unchecked_transaction", reason = "L2, L4: reach the database through a port" },
    { path = "rusqlite::params_from_iter", reason = "L2, L4: reach the database through a port" },
]

